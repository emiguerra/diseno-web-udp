<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Constelación UDP — mobile</title>
<style>
  @font-face {
    font-family: 'NectoMono';
    src: url('../assets/fonts/NectoMono-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'WorkSans';
    src: url('../assets/fonts/WorkSans-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'WorkSans';
    src: url('../assets/fonts/WorkSans-Regular.ttf') format('truetype');
    font-weight: 600; font-style: normal;
  }

  /* Tipografía de la lista de proyectos (escalada al polígono 330×960) */
  .proj-section-title {
    font-family: 'WorkSans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    fill: rgba(255,255,255,0.55);
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .proj-num {
    font-family: 'WorkSans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    fill: rgba(255,255,255,0.45);
    letter-spacing: .08em;
  }
  .proj-name {
    font-family: 'WorkSans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    fill: #ffffff;
    letter-spacing: .005em;
  }
  .proj-info {
    font-family: 'WorkSans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    fill: rgba(255,255,255,0.7);
    letter-spacing: .02em;
  }
  .proj-section {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    fill: rgba(255,255,255,0.88);
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .proj-section-count {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 7.5px;
    font-weight: 400;
    fill: rgba(255,255,255,0.5);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .proj-divider {
    stroke: #ffffff;
    stroke-opacity: 0.35;
    stroke-width: 0.5;
  }
  /* Estado activo · click sobre un proyecto enciende su convenio asociado
     y atenúa los demás proyectos y convenios */
  .proj-trigger { cursor: pointer; transition: opacity .25s, fill-opacity .25s; }
  .cnv-item    { transition: opacity .25s, fill-opacity .25s; }
  .proj-trigger.proj-dim,
  .cnv-item.cnv-dim {
    opacity: 0.18;
  }
  .proj-trigger.proj-active {
    fill: #ffffff;
    fill-opacity: 1;
  }
  .cnv-item.cnv-active {
    fill: #ffffff;
    fill-opacity: 1;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.55));
  }

  /* Tipografía de la lista de cursos (polígono derecho) */
  .crs-header {
    font-family: 'WorkSans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    fill: #ffffff;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .crs-subheader {
    font-family: 'WorkSans', sans-serif;
    font-size: 8px;
    font-weight: 400;
    fill: rgba(255,255,255,0.55);
    letter-spacing: .18em;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .crs-code {
    font-family: 'WorkSans', sans-serif;
    font-size: 9px;
    font-weight: 600;
    fill: #ffffff;
    letter-spacing: .04em;
  }
  .crs-name {
    font-family: 'WorkSans', sans-serif;
    font-size: 9px;
    font-weight: 400;
    fill: rgba(255,255,255,0.78);
    letter-spacing: .01em;
  }
  .crs-section {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    fill: rgba(255,255,255,0.88);
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .crs-section-count {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 7.5px;
    font-weight: 400;
    fill: rgba(255,255,255,0.5);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .crs-divider {
    stroke: #ffffff;
    stroke-opacity: 0.35;
    stroke-width: 0.5;
  }

  /* Tipografía de las 4 menciones (header superior) */
  .men-title {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 8px;
    font-weight: 700;
    fill: #ffffff;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .men-body {
    font-family: 'WorkSans', sans-serif;
    font-size: 6px;
    font-weight: 400;
    fill: rgba(255,255,255,0.82);
    letter-spacing: .015em;
  }
  .men-divider {
    stroke: #ffffff;
    stroke-opacity: 0.30;
    stroke-width: 0.5;
  }

  /* Tipografía de la leyenda (cuadrante superior derecho) */
  .lgnd-title {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    fill: #ffffff;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .lgnd-label {
    font-family: 'WorkSans', sans-serif;
    font-size: 9px;
    font-weight: 400;
    fill: rgba(255,255,255,0.85);
    letter-spacing: .015em;
  }
  .lgnd-divider {
    stroke: #ffffff;
    stroke-opacity: 0.35;
    stroke-width: 0.5;
  }

  /* Tipografía del header de convenios (8 columnas × 2 filas) */
  .cnvh-acro {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    fill: #ffffff;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .cnvh-name {
    font-family: 'WorkSans', sans-serif;
    font-size: 6px;
    font-weight: 400;
    fill: rgba(255,255,255,0.65);
    letter-spacing: .04em;
    text-anchor: middle;
  }

  /* Tipografía del bloque horizontal de menciones (420,870 → 1560,1020) */
  /* Versión HTML (foreignObject) para texto justificado real */
  .menv-col {
    width: 100%;
    height: 100%;
    padding: 14px 14px 12px 14px;
    box-sizing: border-box;
    font-family: 'WorkSans', sans-serif;
  }
  /* Título de mención · cápsula con borde punteado igual a los cuadros
     delimitadores (stroke #fff opacity 0.4 · width 1 · dasharray 3 3) */
  .menv-col-title {
    display: inline-block;
    background: #000000;
    border: 1px dashed rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 9px 14px;
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .menv-col-body {
    font-family: 'WorkSans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    line-height: 1.45;
    letter-spacing: 0.015em;
    text-align: justify;
    text-justify: inter-word;
    hyphens: auto;
    -webkit-hyphens: auto;
  }
  /* SVG fallbacks (mantenidos por si se necesitan) */
  .menv-title {
    font-family: 'WorkSans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    fill: #ffffff;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .menv-tag {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 6.5px;
    font-weight: 400;
    fill: rgba(255,255,255,0.55);
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .menv-body {
    font-family: 'WorkSans', sans-serif;
    font-size: 7.5px;
    font-weight: 400;
    fill: rgba(255,255,255,0.78);
    letter-spacing: .015em;
  }
  .menv-divider {
    stroke: #ffffff;
    stroke-opacity: 0.35;
    stroke-width: 0.5;
  }

  /* Tipografía de la lista de convenios (polígono inferior) */
  .cnv-banner-title {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 18px;
    font-weight: 700;
    fill: #ffffff;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .cnv-banner-sub {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 8px;
    font-weight: 400;
    fill: rgba(255,255,255,0.55);
    letter-spacing: .20em;
    text-transform: uppercase;
  }
  .cnv-acro {
    font-family: 'WorkSans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    fill: #ffffff;
    letter-spacing: .03em;
  }
  .cnv-name {
    font-family: 'WorkSans', sans-serif;
    font-size: 6px;
    font-weight: 400;
    fill: rgba(255,255,255,0.7);
    letter-spacing: .015em;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* MOBILE · el diagrama ocupa el ancho y la página se recorre en vertical */
  html, body { width: 100%; background: #000; overflow-x: hidden; }
  svg { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; }
  #coord-tip, #coord-marker { display: none; }


  /* ── MOBILE · panel inferior (bottom sheet) con la ficha del docente ──
     Reemplaza la viñeta on-hover: en touch no hay hover, así que tocar
     un punto abre este panel con tipografía a tamaño legible. */
  #dc-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 100;
    max-width: 560px;
    margin: 0 auto;
    max-height: 62vh;
    overflow-y: auto;
    background: #000;
    border-top: 1px solid #ffffff;
    border-radius: 16px 16px 0 0;
    padding: 10px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
    color: rgba(255,255,255,0.85);
    font-family: 'WorkSans', sans-serif;
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
  }
  #dc-sheet.open { transform: translateY(0); }
  .dcs-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.35);
    margin: 0 auto 14px;
  }
  .dcs-close {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px;
    background: transparent; border: 1px dashed rgba(255,255,255,0.4);
    border-radius: 8px; color: #fff; font-size: 16px; line-height: 1;
    cursor: pointer;
  }
  .dcs-area {
    display: inline-block;
    border: 1px dashed rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 5px 9px;
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: #fff;
    margin-bottom: 12px;
  }
  .dcs-name {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 17px; font-weight: 700;
    color: #ffffff;
    letter-spacing: .1em; text-transform: uppercase;
    line-height: 1.25;
    padding-right: 44px;
  }
  .dcs-cargo {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    letter-spacing: .16em; text-transform: uppercase;
    margin-top: 6px;
  }
  .dcs-divider { height: 1px; background: rgba(255,255,255,0.3); margin: 14px 0 12px; }
  .dcs-section { margin-bottom: 12px; }
  .dcs-section:last-child { margin-bottom: 0; }
  .dcs-label {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: .22em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .dcs-value { font-size: 14px; line-height: 1.45; letter-spacing: .01em; }

  /* Tooltip de coordenadas */
  #coord-tip {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 4px 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: .04em;
    transform: translate(14px, -28px);
    opacity: 0;
    transition: opacity .12s ease;
  }
  #coord-tip.visible { opacity: 1; }

  /* Highlight de la + bajo el cursor */
  #coord-marker {
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s ease;
  }
  #coord-marker.visible { opacity: 1; }

  /* Cursor visible sólo en modo demo · crosshair blanco fino (mismo look
     que el cursor "crosshair" del sistema). Eventos sintéticos no mueven
     el cursor real del SO, por eso dibujamos uno propio para el GIF.
     Sin transition: la posición se interpola por JS frame-by-frame para
     que el movimiento se vea fluido como un mouse real. */
  #demo-cursor {
    position: fixed;
    width: 16px;
    height: 16px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    display: none;
  }
  #demo-cursor::before,
  #demo-cursor::after {
    content: '';
    position: absolute;
    background: #ffffff;
  }
  #demo-cursor::before {           /* línea horizontal */
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    margin-top: -0.5px;
  }
  #demo-cursor::after {            /* línea vertical */
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    margin-left: -0.5px;
  }
  #demo-cursor.visible { display: block; }

  /* Flotación de los nodos · órbita circular de 5 px alrededor de su eje
     central, ocho posiciones para movimiento suave. Cada nodo entra en
     distinta fase (animation-delay vía JS por área) y los puntos docentes
     comparten el timing de su área para flotar con el nodo correspondiente
     y no quedar ocultos detrás cuando se desplaza. */
  @keyframes node-float {
    0%    { transform: translate(5px, 0); }
    12.5% { transform: translate(3.54px, -3.54px); }
    25%   { transform: translate(0, -5px); }
    37.5% { transform: translate(-3.54px, -3.54px); }
    50%   { transform: translate(-5px, 0); }
    62.5% { transform: translate(-3.54px, 3.54px); }
    75%   { transform: translate(0, 5px); }
    87.5% { transform: translate(3.54px, 3.54px); }
    100%  { transform: translate(5px, 0); }
  }
  .float-node {
    animation: node-float 8s linear infinite;
    transform-box: fill-box;
  }

  /* Cápsulas (pills) — estilo n-filled (blanco con texto negro) */
  .n-filled rect { fill: #ffffff; stroke: none; }
  /* Cápsulas estilo n-open (sólo stroke blanco) — usadas en menciones */
  .n-open rect { fill: #000000; stroke: #ffffff; stroke-width: 1.4; }
  .caps-name {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .10em;
    fill: #000000;
    text-anchor: middle;
    dominant-baseline: central;
    text-transform: uppercase;
    pointer-events: none;
  }
  .n-open .caps-name { fill: #ffffff; }

  /* Aristas CL → menciones (hierárquicas) */
  .edge-mention {
    fill: none;
    stroke: #ffffff;
    stroke-width: 0.9;
    stroke-opacity: 0.65;
    pointer-events: none;
  }

  /* Camino activo · al hacer click sobre una mención se "encienden"
     todos los elementos con el mismo data-mention (nodo + aristas + labs).
     Triggers: nodos del diagrama y títulos del bloque inferior. */
  .mention-trigger { cursor: pointer; }
  .mention-trigger rect { transition: stroke-width .18s, stroke-opacity .18s; }
  div.menv-col-title.mention-trigger {
    transition: border-color .18s, color .18s;
  }
  div.menv-col-title.mention-trigger:hover {
    border-color: rgba(255,255,255,0.85);
  }
  div.menv-col-title.mention-trigger.path-active {
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
    border-style: solid;
  }
  /* Flujo de electricidad por las aristas activas · marching ants
     que avanza desde CL hacia los laboratorios. */
  @keyframes electric-flow {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -22; }
  }
  /* Pulso suave del glow en los nodos del camino activo */
  @keyframes electric-pulse {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255,255,255,0.45)); }
    50%      { filter: drop-shadow(0 0 7px rgba(255,255,255,0.85)); }
  }
  .edge-mention.path-active,
  .edge-lab.path-active {
    stroke-opacity: 1;
    stroke-width: 1.7;
    stroke-dasharray: 7 4;
    animation: electric-flow 0.7s linear infinite;
    filter: drop-shadow(0 0 3px rgba(255,255,255,0.65));
  }
  .n-open.path-active rect {
    stroke-opacity: 1;
    stroke-width: 2;
    animation: electric-pulse 1.4s ease-in-out infinite;
  }
  .n-open.path-active .caps-name,
  .n-open.path-active .caps-lab {
    fill: #ffffff;
  }
  /* La mención SELECCIONADA (trigger del path) se rellena de blanco con
     texto negro para indicar inequívocamente que es la elegida.
     Aplica al nodo del diagrama (rect) y al título HTML del bloque. */
  .mention-trigger.path-active rect {
    fill: #ffffff;
  }
  .mention-trigger.path-active .caps-name {
    fill: #000000;
  }

  /* Aristas mención → laboratorios (más finas) */
  .edge-lab {
    fill: none;
    stroke: #ffffff;
    stroke-width: 0.7;
    stroke-opacity: 0.5;
    pointer-events: none;
  }
  /* Texto pequeño dentro de pills de laboratorio (sólo siglas) */
  .caps-lab {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: .12em;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: central;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Docentes · puntos titilantes distribuidos por área de mención */
  .docente-point {
    fill: #ffffff;
    fill-opacity: 0.7;
    cursor: pointer;
    animation: docente-twinkle 3s ease-in-out infinite;
  }
  .docente-point.is-active {
    fill: #ffffff;
    animation: none;
    fill-opacity: 1;
  }
  @keyframes docente-twinkle {
    0%, 100% { fill-opacity: 0.20; }
    50%      { fill-opacity: 0.95; }
  }

  /* Viñeta de docente · HTML dentro de foreignObject · alto responsivo al contenido */
  .dc-card {
    background: #000;
    border: 1px solid #ffffff;
    padding: 14px 14px 12px 14px;
    box-sizing: border-box;
    width: 240px;
    font-family: 'WorkSans', sans-serif;
    color: rgba(255,255,255,0.85);
  }
  .dc-name {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .dc-cargo {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 6.5px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.3;
    margin-top: 4px;
  }
  .dc-divider {
    height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 10px 0 8px;
  }
  .dc-section { margin-bottom: 8px; }
  .dc-section:last-child { margin-bottom: 0; }
  .dc-label {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 6px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .dc-value {
    font-family: 'WorkSans', sans-serif;
    font-size: 8px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.015em;
    line-height: 1.4;
  }

  /* Mini-card al hover sobre un nodo · viñeta blanca con texto negro
     (invertida respecto a la docente para distinguirla visualmente) */
  .ni-card {
    background: #ffffff;
    border: 1px solid #000000;
    padding: 12px 14px 11px 14px;
    box-sizing: border-box;
    width: 220px;
    font-family: 'WorkSans', sans-serif;
    color: #000000;
  }
  .ni-title {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #000000;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .ni-divider {
    height: 1px;
    background: rgba(0,0,0,0.35);
    margin: 9px 0 7px;
  }
  .ni-section { margin-bottom: 6px; }
  .ni-section:last-child { margin-bottom: 0; }
  .ni-label {
    font-family: 'NectoMono', 'Courier New', monospace;
    font-size: 6px;
    font-weight: 700;
    color: rgba(0,0,0,0.55);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .ni-value {
    font-family: 'WorkSans', sans-serif;
    font-size: 9px;
    color: #000000;
    letter-spacing: 0.015em;
    line-height: 1.35;
  }

  /* ── Lista de cursos dinámica (panel derecho) ── */
  .crs-fo-wrap {
    width: 300px;
    height: 720px;
    overflow: hidden;
    box-sizing: border-box;
  }
  .crs-fo-scroll {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 0 10px 12px 0;
    box-sizing: border-box;
    scrollbar-width: thin;

<script>
(function () {
  'use strict';

  // ══════════════════════════════════════════════════
  // Lista de cursos dinámica + popup de detalle
  // ══════════════════════════════════════════════════
  var IMGS_BASE = '../cursos/datos_catalogo/imagenes/';
  var cursosData = [];

  var CAT_ORDER = [
    'Taller III',
    'Talleres Verticales',
    'Cursos de Profundización',
    'Prácticas Electivas',
    'Cursos de Especialización',
    'Seminario de Título'
  ];

  function buildCourseList(cursos) {
    var byCategory = {};
    cursos.forEach(function (c) {
      var cat = c.categoria || 'Otro';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(c);
    });

    var listEl = document.getElementById('crs-list');
    if (!listEl) return;
    listEl.innerHTML = '';

    var order = CAT_ORDER.filter(function (k) { return byCategory[k]; });
    Object.keys(byCategory).forEach(function (k) {
      if (order.indexOf(k) < 0) order.push(k);
    });

    order.forEach(function (cat) {
      var items = byCategory[cat];
      var block = document.createElement('div');
      block.className = 'crs-cat-block';

      var hr = document.createElement('hr');
      hr.className = 'crs-cat-divider';
      block.appendChild(hr);

      var hdr = document.createElement('div');
      hdr.className = 'crs-cat-header-row';
      hdr.innerHTML =
        '<span class="crs-cat-title">' + cat + '</span>' +
        '<span class="crs-cat-count">' + items.length + ' curso' + (items.length !== 1 ? 's' : '') + '</span>';
      block.appendChild(hdr);

      items.forEach(function (c, idx) {
        var row = document.createElement('div');
        row.className = 'crs-row';
        var code = c.codigo ? c.codigo.split(' ')[0] : ('p' + String(c.pagina).padStart(2, '0'));
        var nombre = c.nombre_taller || c.nombre_curso || '—';
        row.innerHTML =
          '<span class="crs-row-code">' + code + '</span>' +
          '<span class="crs-row-name">' + nombre + '</span>';
        row.addEventListener('click', function (e) {
          e.stopPropagation();
          openCursoPopup(c, row);
        });
        block.appendChild(row);
      });

      listEl.appendChild(block);
    });
  }

  // ── Popup de curso ──
  var cursoPopup = document.getElementById('curso-popup');
  var activeCursoRow = null;

  function setCpSection(secId, valId, val) {
    var sec = document.getElementById(secId);
    var v   = document.getElementById(valId);
    if (val && String(val).trim()) {
      v.textContent = val;
      if (sec) sec.style.display = '';
    } else {
      if (v) v.textContent = '';
      if (sec) sec.style.display = 'none';
    }
  }

  function openCursoPopup(c, rowEl) {
    if (activeCursoRow) activeCursoRow.style.background = '';
    activeCursoRow = rowEl;
    rowEl.style.background = 'rgba(255,255,255,0.12)';

    var img = document.getElementById('cp-img');
    if (c.imagenes && c.imagenes.length) {
      img.src = IMGS_BASE + c.imagenes[0];
      img.style.display = 'block';
    } else {
      img.src = '';
      img.style.display = 'none';
    }

    document.getElementById('cp-taller').textContent = c.nombre_taller || c.nombre_curso || '—';
    document.getElementById('cp-curso').textContent  = c.nombre_curso || '';
    setCpSection('cp-prof-section', 'cp-prof', c.profesores || '');
    setCpSection('cp-sec-section',  'cp-sec',  c.seccion    || '');
    setCpSection('cp-desc-section', 'cp-desc', c.descripcion || '');

    // Posicionar popup: a la izquierda del panel de cursos (x=1590), centrado verticalmente
    var W = 300;
    var svgEl = document.querySelector('svg');
    cursoPopup.setAttribute('width', W);
    cursoPopup.setAttribute('height', 600);
    cursoPopup.setAttribute('x', '-9999');
    cursoPopup.setAttribute('y', '-9999');
    cursoPopup.style.display = 'block';

    var inner = document.getElementById('cp-card');
    var H = Math.ceil(inner.offsetHeight);

    var cx = 1590 - W - 16;
    var cy = 300 + (720 - H) / 2;
    if (cy < 20) cy = 20;
    if (cy + H > 1060) cy = 1060 - H;

    cursoPopup.setAttribute('x', cx.toFixed(1));
    cursoPopup.setAttribute('y', cy.toFixed(1));
    cursoPopup.setAttribute('height', H);
  }

  function closeCursoPopup() {
    cursoPopup.style.display = 'none';
    if (activeCursoRow) activeCursoRow.style.background = '';
    activeCursoRow = null;
  }

  fetch('../cursos/datos_catalogo/cursos.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      cursosData = data;
      buildCourseList(data);
    })
    .catch(function () {
      var listEl = document.getElementById('crs-list');
      if (listEl) listEl.innerHTML =
        '<div style="font-family:NectoMono,monospace;font-size:8px;color:rgba(255,255,255,0.4);padding:8px 0;letter-spacing:.1em;">Ejecuta con servidor local para ver los cursos.</div>';
    });

  // ══════════════════════════════════════════════════

  var svg       = document.querySelector('svg');
  var hoverArea = document.getElementById('hover-area');
  var marker    = document.getElementById('coord-marker');
  var markerH   = document.getElementById('coord-marker-h');
  var markerV   = document.getElementById('coord-marker-v');
  var tip       = document.getElementById('coord-tip');

  /* Tolerancia en unidades del viewBox para detectar marcadores.
     STEP=30 cubre tanto las + (en múltiplos de 60) como los puntos
     intermedios (en múltiplos de 30 con uno de los ejes en 60n). */
  var SNAP_TOL = 10;
  var STEP     = 30;

  /* Convierte coords de pantalla → coords del viewBox del SVG. */
  var pt = svg.createSVGPoint();
  function toSvgCoords(clientX, clientY) {
    pt.x = clientX;
    pt.y = clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return pt.matrixTransform(ctm.inverse());
  }

  hoverArea.addEventListener('mousemove', function (e) {
    var p = toSvgCoords(e.clientX, e.clientY);
    if (!p) return;

    /* Coordenadas crudas (clamp al rango del lienzo) */
    var rx = Math.max(0, Math.min(1920, Math.round(p.x)));
    var ry = Math.max(0, Math.min(1080, Math.round(p.y)));

    /* Marcador más cercano (snap a múltiplos de 30) */
    var nx = Math.round(p.x / STEP) * STEP;
    var ny = Math.round(p.y / STEP) * STEP;
    var dx = p.x - nx;
    var dy = p.y - ny;
    var inRange = nx >= 0 && nx <= 1920 && ny >= 0 && ny <= 1080;
    /* Determina si el punto (nx,ny) tiene un marcador real:
         + en (60n, 60m) — ambas coords múltiplos de 60
         · en (30+60n, 60m) o (60n, 30+60m) — un eje "media celda"
         (30+60n, 30+60m) NO tiene marcador (centros de celda) */
    var nxMod = ((nx % 60) + 60) % 60;
    var nyMod = ((ny % 60) + 60) % 60;
    var hasMarker = !(nxMod === 30 && nyMod === 30);
    var onPlus = (
      hasMarker && inRange &&
      Math.sqrt(dx * dx + dy * dy) <= SNAP_TOL
    );

    /* Tooltip siempre visible siguiendo al cursor.
       Si estamos sobre un marcador (cruz o punto), snap a su coord;
       si no, muestra la coord exacta del cursor. */
    if (onPlus) {
      marker.setAttribute('transform', 'translate(' + nx + ' ' + ny + ')');
      marker.classList.add('visible');
      tip.textContent = '(' + nx + ', ' + ny + ')';
    } else {
      marker.classList.remove('visible');
      tip.textContent = '(' + rx + ', ' + ry + ')';
    }
    tip.style.left = e.clientX + 'px';
    tip.style.top  = e.clientY + 'px';
    tip.classList.add('visible');
  });

  hoverArea.addEventListener('mouseleave', function () {
    tip.classList.remove('visible');
    marker.classList.remove('visible');
  });

}());
</script>

  function isInsideFilled(x, y) {
    for (var i = 0; i < filledBounds.length; i++) {
      var c = filledBounds[i];
      if (x >= c.x1 - DOT_PAD && x <= c.x2 + DOT_PAD &&
          y >= c.y1 - DOT_PAD && y <= c.y2 + DOT_PAD) return true;
    }
    return false;
  }

  // PRNG con semilla fija
  var seed = 137;
  function rand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  function generatePos(region) {
    for (var i = 0; i < 200; i++) {
      var angle = rand() * 2 * Math.PI;
      var rad = Math.sqrt(rand());
      var x = region.cx + rad * region.rx * Math.cos(angle);
      var y = region.cy + rad * region.ry * Math.sin(angle);
      if (!isInsideFilled(x, y)) return { x: x, y: y };
    }
    // Fallback: borde de la elipse · seguir intentando hasta encontrar uno libre
    for (var j = 0; j < 60; j++) {
      var a = rand() * 2 * Math.PI;
      var fx = region.cx + region.rx * Math.cos(a);
      var fy = region.cy + region.ry * Math.sin(a);
      if (!isInsideFilled(fx, fy)) return { x: fx, y: fy };
    }
    return { x: region.cx + region.rx, y: region.cy };
  }

  // Posiciones fijas de los puntos secundarios · docentes con rol coordinador
  // en VCM y satélites (mismo docente aparece 2 veces, conectado por línea).
  // Coords elegidas fuera de los bounds (con buffer 6.2) para no superponer.
  var secondaryPositions = {

    vcm:  { x: 190, y: 58 },    // sobre nodo VCM

  // Hash determinista por clave de área: cada nodo y sus puntos asociados
  // comparten exactamente el mismo phase/duration → flotan en sincronía.
  function areaTiming(key) {
    var h = 0;
    for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return {
      delay:    '-' + (((h % 800) / 100).toFixed(2)) + 's',
      duration: ((7 + (h % 240) / 100).toFixed(2)) + 's'
    };
  }
  function applyFloat(el, area) {
    el.classList.add('float-node');
    var t = areaTiming(area);
    el.style.animationDelay    = t.delay;
    el.style.animationDuration = t.duration;
  }

  // ==== Generación de puntos ====

  function makeDot(x, y, idx, isSecondary, area) {
    // Wrapper g · recibe la animación de flotación sincronizada con el nodo
    // del área. El círculo conserva su animación de twinkle por separado.
    var wrap = document.createElementNS(SVG_NS, 'g');
    if (area) applyFloat(wrap, area);

    var dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', x.toFixed(1));
    dot.setAttribute('cy', y.toFixed(1));
    dot.setAttribute('r', '5.2');
    dot.setAttribute('class', 'docente-point');
    dot.setAttribute('data-idx', idx);
    if (isSecondary) dot.setAttribute('data-secondary', '1');
    dot.style.animationDelay = (rand() * 4).toFixed(2) + 's';
    dot.style.animationDuration = (2.2 + rand() * 2.6).toFixed(2) + 's';

    wrap.appendChild(dot);
    docentesGroup.appendChild(wrap);
    return dot;
  }

  function wrapText(text, maxChars) {
    if (!text) return [];
    var words = String(text).split(/\s+/);
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var test = line ? line + ' ' + w : w;
      if (test.length <= maxChars) line = test;
      else { if (line) lines.push(line); line = w; }
    }
    if (line) lines.push(line);
    return lines;
  }

  function truncate(text, maxChars) {
    if (!text) return '';
    return text.length <= maxChars ? text : text.slice(0, maxChars - 1) + '…';
  }

    card.setAttribute('x', cx.toFixed(1));
    card.setAttribute('y', cy.toFixed(1));
    card.setAttribute('height', H);
  }

      cx = Math.max(10, Math.min(ccx - W / 2, VB_W - W - 10));
      cy = ry + rh + 10;
    }
    if (cy < 10) cy = 10;
    if (cy + H > VB_H - 10) cy = ry - H - 10;

    nodeInfoCard.setAttribute('x', cx.toFixed(1));
    nodeInfoCard.setAttribute('y', cy.toFixed(1));
    nodeInfoCard.setAttribute('height', H);
  }

  function closeNodeInfo() {
    nodeInfoCard.style.display = 'none';
    activeNodeKey = null;
  }

  // Hover unificado · puntos docentes (prioridad) → nodos → nada.
  // En cada caso oculta tooltip/marcador y cierra cards no relevantes.
  var hoverArea = document.getElementById('hover-area');
  var coordTip    = document.getElementById('coord-tip');
  var coordMarker = document.getElementById('coord-marker');
  hoverArea.addEventListener('mousemove', function (e) {
    // MOBILE · sobre un punto sólo se indica que es tocable; la ficha
    // se abre con click/tap en el panel inferior (ver más abajo).
    var dot = findNearestDot(e.clientX, e.clientY);
    if (dot) {
      if (activeNodeKey) closeNodeInfo();
      coordTip.classList.remove('visible');
      coordMarker.classList.remove('visible');
      hoverArea.style.cursor = 'pointer';
      return;
    }
    var node = findNodeAt(e.clientX, e.clientY);
    if (node) {
      var key = getNodeKey(node);
      if (key) {
        openNodeInfo(key, node);
        if (activeDot) closeCard();
        coordTip.classList.remove('visible');
        coordMarker.classList.remove('visible');
        hoverArea.style.cursor = 'pointer';
        return;
      }
    }
    // Nada interactivo bajo el cursor
    if (activeDot)     closeCard();
    if (activeNodeKey) closeNodeInfo();
    hoverArea.style.cursor = 'crosshair';
  });


  // ==== MOBILE · ficha del docente en panel inferior ====
  // Los puntos miden ~10 px: el tap busca el punto más cercano dentro de
  // un radio táctil de 22 px (≈ 44 px de diámetro) usando su posición real
  // en pantalla, que incluye la flotación animada.
  var TAP_RADIUS = 22;
  function findNearestDot(clientX, clientY) {
    var best = null, bestD = TAP_RADIUS;
    docentesGroup.querySelectorAll('.docente-point').forEach(function (d) {
      var r = d.getBoundingClientRect();
      var dx = r.left + r.width / 2 - clientX;
      var dy = r.top + r.height / 2 - clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestD) { bestD = dist; best = d; }
    });
    return best;
  }

  var sheet = document.getElementById('dc-sheet');
  function setSheetSection(secId, valId, val) {
    var sec = document.getElementById(secId);
    var v   = document.getElementById(valId);
    if (val && String(val).trim()) { v.textContent = val; sec.style.display = ''; }
    else                           { v.textContent = '';  sec.style.display = 'none'; }
  }
  function openSheet(idx, dot) {
    var doc = docentes[idx];
    if (!doc) return;
    if (activeDot) activeDot.classList.remove('is-active');
    activeDot = dot;
    dot.classList.add('is-active');
    if (activeNodeKey) closeNodeInfo();

    var area = nodeInfo[doc.area];
    var areaEl = document.getElementById('dcs-area');
    areaEl.textContent = area ? area.title : '';
    areaEl.style.display = area ? '' : 'none';
    document.getElementById('dcs-name').textContent = doc.name || '';
    var cargoEl = document.getElementById('dcs-cargo');
    cargoEl.textContent = doc.cargo || '';
    cargoEl.style.display = doc.cargo ? '' : 'none';
    setSheetSection('dcs-pregrado-section',   'dcs-pregrado',   (doc.pregrado && doc.pregrado !== '—') ? doc.pregrado : '');
    // Los part-time guardan sus cursos en `postgrados` ("Cursos: …") → etiqueta propia
    var pg = doc.postgrados || '';
    var isCursos = pg.indexOf('Cursos: ') === 0;
    document.getElementById('dcs-postgrados-label').textContent = isCursos ? 'Cursos' : 'Postgrados';
    setSheetSection('dcs-postgrados-section', 'dcs-postgrados', isCursos ? pg.slice(8) : pg);
    setSheetSection('dcs-skills-section',     'dcs-skills',     (doc.skills || []).join(' · '));

    sheet.scrollTop = 0;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    if (activeDot) activeDot.classList.remove('is-active');
    activeDot = null;
  }

  // Tap sobre el diagrama: punto cercano → abre ficha · fuera → cierra.
  // Se registra en captura para resolverse antes que menciones/proyectos.
  document.addEventListener('click', function (e) {
    if (sheet.contains(e.target)) return;
    var dot = findNearestDot(e.clientX, e.clientY);
    if (dot) {
      openSheet(+dot.getAttribute('data-idx'), dot);
      e.stopImmediatePropagation();
      return;
    }
    if (sheet.classList.contains('open')) closeSheet();
  }, true);
  document.getElementById('dcs-close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  // Deslizar el panel hacia abajo lo cierra
  var dragY0 = null;
  sheet.addEventListener('touchstart', function (e) {
    dragY0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null;
  }, { passive: true });
  sheet.addEventListener('touchmove', function (e) {
    if (dragY0 === null) return;
    var dy = e.touches[0].clientY - dragY0;
    if (dy > 0) sheet.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  sheet.addEventListener('touchend', function (e) {
    if (dragY0 === null) return;
    var dy = e.changedTouches[0].clientY - dragY0;
    sheet.style.transform = '';
    dragY0 = null;
    if (dy > 70) closeSheet();
  });

  // ==== Flotación de nodos · cada nodo flota con el timing de su área
  // (reusa nodeAreaMap definido arriba para hover-info). ====
  document.querySelectorAll('g.n-filled, g.n-open, #node-dir').forEach(function (g) {
    var area = getNodeKey(g);
    if (area) applyFloat(g, area);
  });

  // ==== Click en mención · enciende su camino completo ====
  // El #hover-area está sobre todo el lienzo y atrapa el evento click antes
  // que el target real, por eso usamos elementsFromPoint para encontrar el
  // .mention-trigger debajo del cursor (mismo truco que con los puntos
  // docentes). Triggers válidos:
  //   · 4 nodos de mención en el diagrama (g.mention-trigger)
  //   · 4 títulos del bloque de menciones inferior (div.mention-trigger)
  var activeMention = null;
  var idleTimer     = null;
  var IDLE_MS       = 10000;  // 10 s sin clicks → vuelve al estado 00
  function cancelIdleTimer() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  }
  function startIdleTimer() {
    cancelIdleTimer();
    idleTimer = setTimeout(function () {
      clearActivePath();
    }, IDLE_MS);
  }
  function clearActivePath() {
    document.querySelectorAll('.path-active').forEach(function (el) {
      el.classList.remove('path-active');
    });
    activeMention = null;
    cancelIdleTimer();
  }
  function activatePath(key) {
    document.querySelectorAll('[data-mention="' + key + '"]').forEach(function (el) {
      el.classList.add('path-active');
    });
    activeMention = key;
    startIdleTimer();
  }
  function findMentionTriggerAt(clientX, clientY) {
    var els = document.elementsFromPoint(clientX, clientY);
    for (var i = 0; i < els.length; i++) {
      var t = els[i].closest && els[i].closest('.mention-trigger');
      if (t) return t;
    }
    return null;
  }
  // ==== Tag proyectos y convenios para el sistema click → highlight ====
  // Cada proj-num + sus proj-name/proj-info siguientes reciben data-proj.
  // Cada cnvh-acro + su cnvh-name siguiente reciben data-cnv.
  document.querySelectorAll('.proj-num').forEach(function (numEl) {
    var num = numEl.textContent.trim();
    numEl.setAttribute('data-proj', num);
    numEl.classList.add('proj-trigger');
    var sib = numEl.nextElementSibling;
    while (sib) {
      if (sib.classList && (sib.classList.contains('proj-num') ||
                            sib.classList.contains('proj-section') ||
                            sib.classList.contains('proj-divider'))) break;
      if (sib.classList && (sib.classList.contains('proj-name') ||
                            sib.classList.contains('proj-info'))) {
        sib.setAttribute('data-proj', num);
        sib.classList.add('proj-trigger');
      }
      sib = sib.nextElementSibling;
    }
  });
  document.querySelectorAll('.cnvh-acro').forEach(function (acroEl) {
    var key = acroEl.textContent.trim();
    acroEl.setAttribute('data-cnv', key);
    acroEl.classList.add('cnv-item');
    var name = acroEl.nextElementSibling;
    if (name && name.classList && name.classList.contains('cnvh-name')) {
      name.setAttribute('data-cnv', key);
      name.classList.add('cnv-item');
    }
  });

  // Mapping proyecto → convenios asociados (acros) · ajustar según contexto
  var projectConvenios = {
    '01': ['BN'],                     // HDGCH · Historia del Diseño Gráfico
    '02': [],                         // Revista 180 (académica)
    '03': [],                         // Revista zer081
    '04': ['MIM'],                    // Museo Futuro – Congreso Futuro
    '05': [],                         // Muestra Talleres Indumentaria/Textil
    '06': [],                         // Montecarmelo (sin convenio)
    '07': ['MEGM'],                   // Multiplicar las Voces – MEGM
    '08': ['MMDDHH'],                 // Derechos en Juego
    '09': ['AOA'],                    // Laboratorio FaAAD Santiago
    '10': ['BN'],                     // Sala Literatura Infantil
    '11': ['AOA'],                    // Taller Internacional Madrid
    '12': [],                         // Workshop Comic Sans
    '13': [],                         // Máquinas Electrónicas
    '14': [],                         // Aves RM
    '15': [],                         // Processing Community Day
    '16': ['MNBA','MAVI','ATQN'],     // Museo de los Museos
    '17': ['MEGM'],                   // Máquinas Percutoras (GAM)
    '18': ['MOBIL']                   // Bancas
  };

  var activeProj = null;
  var projIdleTimer = null;
  function cancelProjIdle() { if (projIdleTimer) { clearTimeout(projIdleTimer); projIdleTimer = null; } }
  function startProjIdle() {
    cancelProjIdle();
    projIdleTimer = setTimeout(function () { clearProjActivation(); }, IDLE_MS);
  }
  function clearProjActivation() {
    document.querySelectorAll('.proj-active, .proj-dim, .cnv-active, .cnv-dim').forEach(function (el) {
      el.classList.remove('proj-active', 'proj-dim', 'cnv-active', 'cnv-dim');
    });
    activeProj = null;
    cancelProjIdle();
  }
  function activateProject(pid) {
    clearProjActivation();
    activeProj = pid;
    var matches = projectConvenios[pid] || [];

    document.querySelectorAll('.proj-trigger').forEach(function (el) {
      if (el.getAttribute('data-proj') === pid) el.classList.add('proj-active');
      else                                       el.classList.add('proj-dim');
    });
    // Si el proyecto tiene convenios asociados → highlight + dim del resto
    // Si no tiene → convenios quedan en estado normal (sin filtrado)
    if (matches.length) {
      document.querySelectorAll('.cnv-item').forEach(function (el) {
        if (matches.indexOf(el.getAttribute('data-cnv')) >= 0) el.classList.add('cnv-active');
        else                                                    el.classList.add('cnv-dim');
      });
    }
    startProjIdle();
  }
  function findProjectAt(x, y) {
    var els = document.elementsFromPoint(x, y);
    for (var i = 0; i < els.length; i++) {
      var c = els[i].closest && els[i].closest('.proj-trigger');
      if (c) return c;
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    // 1) Click sobre proyecto → activa convenio(s) asociados
    var proj = findProjectAt(e.clientX, e.clientY);
    if (proj) {
      var pid = proj.getAttribute('data-proj');
      if (activeProj === pid) clearProjActivation();
      else                    activateProject(pid);
      e.stopPropagation();
      return;
    }
    // 2) Click sobre mención → activa camino eléctrico
    var trigger = findMentionTriggerAt(e.clientX, e.clientY);
    if (trigger) {
      var key = trigger.getAttribute('data-mention');
      if (activeMention === key) clearActivePath();
      else { clearActivePath(); activatePath(key); }
      e.stopPropagation();
      return;
    }
    // 3) Click fuera → apaga todo
    if (activeMention) clearActivePath();
    if (activeProj)   clearProjActivation();
    if (typeof closeCursoPopup === 'function') closeCursoPopup();
  }, true);

  // ╔════════════════════════════════════════════════════════════════════╗
  // ║ MODO DEMO · activable con ?demo=1 en la URL o tecla "D"            ║
  // ║ Recorre todas las interacciones para grabar un loop limpio en GIF: ║
  // ║   1. Hover sobre 3 puntos docentes (cards negras)                  ║
  // ║   2. Hover sobre 4 nodos del diagrama (cards blancas)              ║
  // ║   3. Click sobre las 4 menciones (camino eléctrico)                ║
  // ║   4. Click sobre 4 proyectos (highlight de convenios)              ║
  // ║ ESC detiene la demo. Después del último paso, el ciclo se repite.  ║
  // ╚════════════════════════════════════════════════════════════════════╝
  function runDemo() {
    if (window.__demoRunning) return;
    window.__demoRunning = true;

    var demoCursor = document.getElementById('demo-cursor');
    demoCursor.classList.add('visible');
    var lastSvg = { x: 50, y: 1050 };  // posición SVG actual del cursor sintético

    function svgToClient(sx, sy) {
      var ctm = svg.getScreenCTM(); if (!ctm) return null;
      var pt = svg.createSVGPoint(); pt.x = sx; pt.y = sy;
      var p = pt.matrixTransform(ctm);
      return { x: p.x, y: p.y };
    }
    function placeCursor(c) {
      demoCursor.style.left = c.x + 'px';
      demoCursor.style.top  = c.y + 'px';
    }
    function dispatchMove(sx, sy) {
      var c = svgToClient(sx, sy); if (!c) return;
      placeCursor(c);
      hoverArea.dispatchEvent(new MouseEvent('mousemove', {
        bubbles: true, cancelable: true, clientX: c.x, clientY: c.y, view: window
      }));
      lastSvg.x = sx; lastSvg.y = sy;
    }
    // Movimiento fluido · interpola entre la posición actual y (sx,sy) durante
    // `duration` ms, disparando un mousemove por frame (~60 fps). Usa
    // ease-in-out para arrancar y frenar suave, como un cursor humano.
    function fireMove(sx, sy, duration) {
      duration = (typeof duration === 'number') ? duration : 700;
      var fromX = lastSvg.x, fromY = lastSvg.y;
      var dx = sx - fromX, dy = sy - fromY;
      // Si el salto es muy corto, dispatch directo
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { dispatchMove(sx, sy); return Promise.resolve(); }
      return new Promise(function (resolve) {
        var start = performance.now();
        function step(now) {
          if (!window.__demoRunning) { resolve(); return; }
          var t = Math.min(1, (now - start) / duration);
          // ease-in-out cubic
          var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          dispatchMove(fromX + dx * e, fromY + dy * e);
          if (t < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }
    function fireClick(sx, sy) {
      var c = svgToClient(sx, sy); if (!c) return;
      placeCursor(c);
      lastSvg.x = sx; lastSvg.y = sy;
      document.dispatchEvent(new MouseEvent('click', {
        bubbles: true, cancelable: true, clientX: c.x, clientY: c.y, view: window
      }));
    }
    function moveAway() { return fireMove(50, 1050, 600); }   // esquina sin elementos

    // Resolución dinámica de puntos a recorrer
    function getDot(idx) { return docentesGroup.querySelector('.docente-point[data-idx="' + idx + '"]'); }
    function dotPos(dot) {
      return { x: parseFloat(dot.getAttribute('cx')), y: parseFloat(dot.getAttribute('cy')) };
    }
    function nodeCenterByText(text) {
      var found = null;
      document.querySelectorAll('g.n-filled, g.n-open, #node-dir').forEach(function (g) {
        if (found) return;
        if (g.id === 'node-dir' && text === 'DIR') { found = g; return; }
        var t = g.querySelector('text');
        if (t && t.textContent.trim() === text) found = g;
      });
      if (!found) return null;
      var rect = found.querySelector('rect');
      var rx = parseFloat(rect.getAttribute('x'));
      var ry = parseFloat(rect.getAttribute('y'));
      var rw = parseFloat(rect.getAttribute('width'));
      var rh = parseFloat(rect.getAttribute('height'));
      return { x: rx + rw / 2, y: ry + rh / 2 };
    }
    function projPos(num) {
      var el = document.querySelector('.proj-name[data-proj="' + num + '"]');
      if (!el) return null;
      var b = el.getBBox();
      return { x: b.x + b.width / 2, y: b.y + b.height / 2 };
    }

    // Sleep encadenable + posibilidad de cancelar
    var demoTimers = [];
    function sleep(ms) {
      return new Promise(function (res) {
        var t = setTimeout(function () { res(); }, ms);
        demoTimers.push(t);
      });
    }
    function cancelAllTimers() {
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }

    // Secuencia: hover 3 docentes → hover 4 nodos → click 4 menciones → click 4 proyectos
    var seqDocentes = [3, 9, 16, 21];                                    // staff: Decana, Bejares, Ma. de la Paz, García
    var seqNodes    = ['GRÁFICO', 'INDUSTRIAL', 'CICLO LICENCIATURA',    // título exacto del rect
                       'VINCULACIÓN CON EL MEDIO', 'CENTRO EDITORIAL'];
    var seqMentions = ['grafico', 'industrial', 'textil', 'interaccion'];
    var seqProjects = ['07', '04', '16', '01'];

    // Navegación libre · arco diagonal limpio top-left → bottom-right.
    // Sin cambios de dirección ni movimientos laterales innecesarios. Pausas
    // de ~900 ms en dos intersecciones de grilla (múltiplos de 60) para que
    // el marcador en cruz blanco se vea claramente sobre el "+".
    var seqNavigation = [
      { x: 180,  y: 240,  travel: 1300, hold: 200 },  // entrada (arriba-izq)
      { x: 480,  y: 420,  travel: 1300, hold: 200 },  // diagonal SE
      { x: 720,  y: 540,  travel: 1000, hold: 900 },  // grid + · pausa marcador
      { x: 1020, y: 660,  travel: 1200, hold: 200 },  // sigue diagonal SE
      { x: 1320, y: 720,  travel: 1000, hold: 900 }   // grid + · pausa final
    ];

    async function loop() {
      while (window.__demoRunning) {
        // 0) Navegación libre · muestra coord-tip + marcador en intersecciones
        for (var n = 0; n < seqNavigation.length && window.__demoRunning; n++) {
          var nv = seqNavigation[n];
          await fireMove(nv.x, nv.y, nv.travel);
          await sleep(nv.hold);
        }
        await moveAway(); await sleep(400);
        // 1) Docentes
        for (var i = 0; i < seqDocentes.length && window.__demoRunning; i++) {
          var dot = getDot(seqDocentes[i]);
          if (dot) { var p = dotPos(dot); await fireMove(p.x, p.y, 1100); await sleep(2900); }
        }
        await moveAway(); await sleep(500);
        // 2) Nodos
        for (var j = 0; j < seqNodes.length && window.__demoRunning; j++) {
          var c = nodeCenterByText(seqNodes[j]);
          if (c) { await fireMove(c.x, c.y, 1100); await sleep(2400); }
        }
        await moveAway(); await sleep(500);
        // 3) Menciones (camino eléctrico) · viaja al nodo, click, observa
        for (var k = 0; k < seqMentions.length && window.__demoRunning; k++) {
          var nm = nodeCenterByText(seqMentions[k] === 'grafico' ? 'GRÁFICO' :
                                    seqMentions[k] === 'industrial' ? 'INDUSTRIAL' :
                                    seqMentions[k] === 'textil' ? 'TEXTIL' : 'INTERACCIÓN');
          if (nm) { await fireMove(nm.x, nm.y, 900); fireClick(nm.x, nm.y); await sleep(4000); }
        }
        await fireMove(50, 1050, 700); fireClick(50, 1050); await sleep(500);
        // 4) Proyectos
        for (var m = 0; m < seqProjects.length && window.__demoRunning; m++) {
          var pp = projPos(seqProjects[m]);
          if (pp) { await fireMove(pp.x, pp.y, 900); fireClick(pp.x, pp.y); await sleep(3700); }
        }
        await fireMove(50, 1050, 700); fireClick(50, 1050); await sleep(1200);
      }
      cancelAllTimers();
    }

    loop();

    // ESC detiene la demo · oculta cursor + limpia estado
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && window.__demoRunning) {
        window.__demoRunning = false;
        cancelAllTimers();
        moveAway();
        fireClick(50, 1050);
        demoCursor.classList.remove('visible');
      }
    });
  }
  window.__startDemo = runDemo;

  // Auto-arranque por URL ?demo=1 o tecla "D"
  if (location.search.indexOf('demo=1') >= 0) {
    setTimeout(runDemo, 1200);
  }
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'd' || e.key === 'D') && !window.__demoRunning) runDemo();
  });
}());
</script>
