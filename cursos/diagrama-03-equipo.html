<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Equipo — Diagrama 03</title>
<style>
  @font-face{
    font-family:'NectoMono';
    src:url('../assets/fonts/NectoMono-Regular.woff2') format('woff2'),
        url('../assets/fonts/NectoMono-Regular.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'WorkSans';
    src:url('../assets/fonts/WorkSans-Regular.woff2') format('woff2'),
        url('../assets/fonts/WorkSans-Regular.ttf') format('truetype');
    font-weight:400 600; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'WorkFaAAD';
    src:url('../assets/fonts/WorkFaAAD-A.woff2') format('woff2'),
        url('../assets/fonts/WorkFaAAD-A.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --ink:#111; --paper:#f4f4f4;
    --dim:rgba(17,17,17,.7); --faint:rgba(17,17,17,.42); --line:rgba(17,17,17,.26);
    --mark:7px;
  }
  html,body{background:transparent;}
  html.standalone,html.standalone body{background:var(--paper);}
  html.embedded .top{display:none;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  /* la trama de + cubre toda la página, no solo el escenario */
  body{color:var(--ink); font-family:'WorkSans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><g stroke='%23111' stroke-width='.8' stroke-opacity='.17' stroke-linecap='square' fill='none'><path d='M24 20v8M20 24h8'/></g></svg>");
    background-size:48px 48px;}

  .top{position:absolute; top:0; left:0; right:0; z-index:30; padding:16px 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:24px; pointer-events:none;}
  .step{max-width:min(520px, 38vw); text-align:right;}
  .step b{display:block; font-family:'NectoMono',monospace; font-weight:400; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink);}
  .step span{display:block; font-size:.78rem; line-height:1.5; color:var(--dim); margin-top:8px;}
  .tag{font-family:'NectoMono',monospace; font-size:14px; letter-spacing:.22em; text-transform:uppercase;}
  .tag small{display:block; opacity:.6; margin-top:3px; letter-spacing:.16em;}

  /* ---------- Escenario: el equipo (instancia 01) se transforma en la constelación (instancia 02) con el scroll ---------- */
  .morph{position:relative; height:800vh;}   /* tres momentos con holds: equipo · organigrama ortogonal · ecosistema orbital */   /* altura extendida: equipo, transición larga, ortho leíble, orbital final */
  .stage{position:sticky; top:0; height:100vh; overflow:hidden; isolation:isolate;}
  .stage svg{overflow:visible;}   /* las órbitas grandes de D3 pueden extenderse fuera del viewBox sin cortarse */
  /* cuadrante de + sobre todo el panel (misma tipografía de signos del referente de Pedro). Opacidad baja; los textos y recuadros llevan fondo paper para no superponerse. */
  .stage::before{content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><g stroke='%23111' stroke-width='.8' stroke-opacity='.17' stroke-linecap='square' fill='none'><path d='M24 20v8M20 24h8'/></g></svg>");
    background-size:48px 48px; background-position:0 0;}
  /* textos sobre fondo paper para que los + no los atraviesen */
  .lvl b, .lvl span, .cap, .name, .top .tag, .step b, .step span, .hint{background:var(--paper);}
  /* Las listas y la leyenda despejan su caja entera, no fila por fila: por fila, la cruz que caía en el
     borde se comía la primera letra del código y cruzaba las reglas de los bloques. El diagrama vive en
     su propio bloque y nunca entra acá, así que la caja puede quedar limpia. */
  .rail, .legend-st{background:var(--paper); box-shadow:0 0 0 7px var(--paper);}

  /* ---------- Modo coordenadas (herramienta de autor, tecla C) ----------
     Convierte el cuadrante de + del fondo en una grilla direccionable: cada cruce es una celda
     tipo F12. Al hacer clic se registra la celda para poder dictar dónde va cada cosa. */
  .cgrid{position:absolute; inset:0; z-index:40; display:none; cursor:crosshair;}
  body.coord .cgrid{display:block;}
  .cgrid i{position:absolute; font-family:'NectoMono',monospace; font-size:8px; letter-spacing:.04em;
    color:rgba(17,17,17,.42); transform:translate(-50%,-50%); pointer-events:none; font-style:normal;}
  .cgrid i.hot{color:var(--ink); font-size:9.5px;}
  .cgrid .xh{position:absolute; background:rgba(17,17,17,.22); pointer-events:none;}
  .cgrid .mk{position:absolute; width:13px; height:13px; margin:-7px 0 0 -7px; border:1.4px solid var(--ink);
    border-radius:50%; pointer-events:none;}
  .cpanel{position:fixed; left:14px; bottom:14px; z-index:60; width:232px; background:var(--paper);
    border:1px solid var(--ink); padding:10px 11px; display:none;
    font-family:'NectoMono',monospace; font-size:10px; line-height:1.55;}
  body.coord .cpanel{display:block;}
  .cpanel h6{font-size:9px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:6px;}
  .cpanel .now{font-size:13px; letter-spacing:.06em; margin-bottom:7px;}
  .cpanel ol{list-style:none; max-height:168px; overflow:auto; margin-bottom:8px;}
  .cpanel li{display:flex; gap:7px; border-top:1px solid rgba(17,17,17,.14); padding:3px 0;}
  .cpanel li b{font-weight:400; min-width:40px;}
  .cpanel li span{color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cpanel .btns{display:flex; gap:6px;}
  .cpanel button{flex:1; font-family:inherit; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    padding:5px 0; background:var(--paper); color:var(--ink); border:1px solid var(--ink); cursor:pointer;}
  .cpanel button:hover{background:var(--ink); color:var(--paper);}
  .cpanel .hint2{color:var(--dim); font-size:9px; margin-top:7px;}
  /* botón siempre visible para entrar al modo coordenadas sin depender del teclado */
  .cbtn{position:fixed; left:14px; bottom:14px; z-index:59; font-family:'NectoMono',monospace;
    font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:6px 10px;
    background:var(--paper); color:var(--dim); border:1px solid rgba(17,17,17,.3); cursor:pointer;}
  .cbtn:hover{color:var(--ink); border-color:var(--ink);}
  body.coord .cbtn{display:none;}
  .lvl b, .step b, .hint{padding:1px 6px 1px 0;}
  .lvl span, .step span{padding:1px 6px 1px 0; display:inline-block;}
  .cap{padding:0 3px; box-sizing:content-box;}
  .name{display:inline-block; padding:2px 4px; margin:14px -4px 0;}
  .cards{z-index:1;} .cons{z-index:2;} .caps{z-index:3;} .lvls{z-index:4;} .top{z-index:5;} .hint{z-index:5;}
  .cards,.lvls,.caps{position:absolute; inset:0; pointer-events:none;}
  .lvls{z-index:4;} .caps{z-index:3;}
  .hint{position:absolute; left:20px; bottom:18px; font-family:'NectoMono',monospace; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); transition:opacity .3s;}

  /* ---------- Recuadro ---------- */
  .card{position:absolute; left:0; top:0; text-align:left; will-change:transform;}
  .frame{position:relative;}
  /* rectángulo limpio: el borde cierra justo en el canto de la foto, sin prolongarse ni cruzarse */
  .frame::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:var(--cm,1);
    border:1px solid var(--ink);
  }
  .ph{
    position:absolute; inset:0; overflow:hidden;
    background:rgba(17,17,17,.06); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'NectoMono',monospace; letter-spacing:.06em;
  }
  /* Encuadre del rostro: --fx/--fy centro de la cara (0–1) · --w ancho de la foto respecto del recuadro · --ar alto/ancho de la foto */
  .ph img{
    position:absolute; max-width:none; display:block;
    width:calc(var(--w) * 100%); height:auto;
    left:clamp(calc(100% - var(--w) * 100%), calc(50% - var(--fx) * var(--w) * 100%), 0%);
    top:clamp(calc(100% - var(--w) * var(--ar) / 1.5 * 100%), calc(34% - var(--fy) * var(--w) * var(--ar) / 1.5 * 100%), 0%);
    filter:grayscale(1) contrast(1.05);
  }
  .card.vacante .ph{background:none; color:var(--faint);}
  .card.vacante .frame::after{opacity:calc(var(--cm,1) * .4);}
  .card.vacante .name{color:var(--faint);}
  .frame{cursor:pointer; outline:none;}
  .name{font-family:'WorkFaAAD','WorkSans',sans-serif; line-height:1.18; margin-top:.9em;}

  /* ---------- Pop-up con la info de la persona ---------- */
  .pop{
    --mark:8px; --dim:rgba(255,255,255,.62); --line:rgba(255,255,255,.24);
    position:fixed; z-index:60; top:0; left:0; width:min(360px,calc(100vw - 32px));
    background:#111; color:#fff; padding:20px 22px 18px;
    pointer-events:none; opacity:0; visibility:hidden; transform:translateY(4px);
    transition:opacity .16s ease, transform .16s ease, visibility 0s .16s;
  }
  .pop.on{opacity:1; visibility:visible; transform:none; transition:opacity .16s ease, transform .16s ease;}
  .pop::after{
    content:''; position:absolute; inset:calc(var(--mark) * -1); pointer-events:none;
    background:
      linear-gradient(var(--ink),var(--ink)) left 0 top var(--mark) / 100% 1px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left 0 bottom var(--mark) / 100% 1px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left var(--mark) top 0 / 1px 100% no-repeat,
      linear-gradient(var(--ink),var(--ink)) right var(--mark) top 0 / 1px 100% no-repeat;
  }
  .pop .face{float:right; width:84px; height:112px; margin:0 0 8px 14px; background:#1b1b1b; overflow:hidden;}
  .pop .face img{width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.05); display:block;}
  .pop .face.no{display:none;}
  .pop .ptag{font-family:'NectoMono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); line-height:1.5;}
  .pop h3{font-family:'WorkFaAAD','WorkSans',sans-serif; font-weight:400; font-size:1.45rem; line-height:1.12; margin:8px 0 10px;}
  .pop dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; border-top:1px solid var(--line); padding-top:12px; font-size:.8rem; line-height:1.4;}
  .pop dt{font-family:'NectoMono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); padding-top:2px;}
  .pop dd ul{list-style:none;}
  .pop .note{margin-top:12px; font-size:.74rem; color:var(--dim);}

  /* ---------- Nombre del nivel ---------- */
  .lvl{position:absolute; left:0; top:0;}
  .stage.port .lvl{white-space:nowrap; background:var(--paper); padding-right:8px; line-height:16px;}
  .stage.port .lvl b{display:inline; font-size:10.5px;}
  .stage.port .lvl span{display:inline; max-width:none; margin:0 0 0 6px; font-size:.7rem;}
  /* corrección Pedro: el nombre completo va DENTRO del círculo (niveles 01 y 02), así que la cap bajo el círculo deja de dibujarse */
  .cap{display:none;}
  .lvl b{display:block; font-family:'NectoMono',monospace; font-weight:400; font-size:13px; letter-spacing:.2em; text-transform:uppercase;}
  .lvl span{display:block; font-size:.78rem; color:var(--dim); margin-top:4px; max-width:150px; line-height:1.3;}

  .foot-note{margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:.78rem; line-height:1.5; color:var(--dim);}
  @media (max-width:760px){ .step{display:none;} }

  /* =====================================================================
     INSTANCIA 02 · Organigrama sobre la grilla del equipo
     ===================================================================== */
  /* la leyenda va por encima del escenario: las órbitas se dibujan con overflow visible
     y si no, la de más abajo se le monta encima */
  /* el cierre arranca bien abajo: si no, al soltar el sticky el texto quedaba encima del diagrama orbital */
  .after{max-width:1240px; margin:0 auto; padding:18vh 32px 90px; position:relative; z-index:10; background:var(--paper);}
  .cons{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible; z-index:2; pointer-events:none;}
  .cons .node,.cons .it,.cons .doc{pointer-events:none; outline:none;}
  .cons.live .node,.cons.live .it,.cons.live .doc{pointer-events:auto; cursor:pointer;}
  .cons .crz{display:none;}            /* las esquinas por celda se reemplazaron por el cuadrante de + sobre todo el panel */
  /* Diferenciación por relleno: solo el NIVEL 01 (dirección y secretaría) va en negro.
     Todo el resto queda en hueco, flotando sobre su órbita. */
  .cons .node .c{fill:var(--paper); stroke:var(--ink); stroke-width:1.3; transition:fill .2s, stroke-width .2s;}
  .cons .node.lvl0 .c{fill:var(--ink); stroke-width:1.5;}
  .cons .node.staff .c{stroke-width:1.2;}
  .cons .node text,.cons .it text{font-family:'NectoMono',monospace; fill:var(--ink); text-anchor:middle; dominant-baseline:central; text-transform:uppercase; letter-spacing:.04em; pointer-events:none; transition:fill .2s;}
  .cons .node.lvl0 text{fill:var(--paper);}            /* sigla blanca solo sobre el relleno negro del nivel 01 */
  .cons .it text{letter-spacing:0;}
  /* hover: lo hueco se rellena; el nivel 01 (ya negro) se invierte a hueco. En ambos casos el estado cambia. */
  .cons .node:hover .c,.cons .node:focus-visible .c,.cons .node.is-on .c{fill:var(--ink); stroke-width:2.6;}
  .cons .node:hover text,.cons .node:focus-visible text,.cons .node.is-on text{fill:var(--paper);}
  .cons .node.lvl0:hover .c,.cons .node.lvl0:focus-visible .c,.cons .node.lvl0.is-on .c{fill:var(--paper);}
  .cons .node.lvl0:hover text,.cons .node.lvl0:focus-visible text,.cons .node.lvl0.is-on text{fill:var(--ink);}
  .cons .node.rel .c{stroke-width:2.8;}
  /* jerarquía ortogonal tipo organigrama clásico: trazo delgado gris, se encienden las conectadas al área al pasar el cursor */
  .cons .edge{fill:none; stroke:#a2a2a2; stroke-width:1.1; transition:stroke .15s;}
  .cons .edge.hot{stroke:var(--ink); stroke-width:1.9 !important; stroke-opacity:1 !important; stroke-dasharray:7 4 !important; stroke-dashoffset:0 !important; animation:electric-flow .7s linear infinite;}
  @keyframes electric-flow{from{stroke-dashoffset:0;}to{stroke-dashoffset:-22;}}
  @media (prefers-reduced-motion:reduce){ .cons .edge.hot{animation:none;} }
  /* Dos listas laterales (instancia 03): ramos a la izquierda, docentes a la derecha.
     Cada ramo se enlaza con su mencion y con los docentes que lo dictan, en los dos sentidos. */
  /* Posicion dictada sobre la grilla de coordenadas (tomada a 2160x1008) y pasada a
     porcentajes del viewport, para que el bloque caiga igual en cualquier pantalla.
     RAMOS    B5 -> M22 (bloque dictado: 72,216 -> 600,1032)  ·  DOCENTES  mismo rango vertical  */
  .rail{position:absolute; transform:none; opacity:0; display:flex; flex-direction:column;}
  .rail.iz{left:3.33%;  width:24.44%; top:21.43%; height:76.57%;}
  .rail.de{left:74.44%; width:24.44%; top:21.43%; height:76.57%; text-align:left;}
  .rail .lst{flex:1; min-height:0;}
  /* los cuerpos van en vh: el bloque dictado es porcentual, asi que el texto escala con el
     y las 49 filas / 93 nombres siempre caben, por grande o chica que sea la pantalla */
  .rail h5{font-family:'NectoMono',monospace; font-weight:400; font-size:min(1.04vh,11.5px); letter-spacing:.2em;
    text-transform:uppercase; color:var(--ink); margin-bottom:9px;}
  .rail.de .lst{display:flex; gap:18px; align-items:flex-start;}
  .rail.de .col{flex:1 1 0; min-width:0;}
  /* encabezado de cada mencion dentro de la lista de docentes */
  .rail .grp{break-inside:auto; margin-bottom:7px;}
  .rail .grp > u{display:block; text-decoration:none; font-family:'NectoMono',monospace;
    font-size:min(.87vh,9.6px); letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
    border-bottom:1px solid rgba(17,17,17,.25); padding-bottom:2px; margin-bottom:3px;
    break-after:avoid;}
  .rail i{display:block; font-style:normal; cursor:pointer; pointer-events:auto; break-inside:avoid;
    font-family:'WorkSans',system-ui,sans-serif; font-size:9.5px; line-height:1.52; color:var(--dim);
    transition:color .14s;}
  .rail.de i{font-size:min(.95vh,10.5px); line-height:1.4; text-align:left;}   /* 93 docentes, dos columnas, bandera a la izquierda */
  .rail i:hover,.rail i.on{color:var(--ink);}
  .rail i.off{opacity:.22;}
  .rail.dimmed i{color:rgba(17,17,17,.3);}
  .rail.dimmed i.on{color:var(--ink);}
  .rail i b{font-family:'NectoMono',monospace; font-weight:400; font-size:min(.92vh,10.1px); letter-spacing:.03em;
    display:inline-block; min-width:5.9em; flex:none;}
  .rail.iz i{display:flex; gap:.8em; font-size:min(.95vh,10.5px); line-height:1.34;}
  /* encabezado de bloque curricular: nombre a la izquierda, recuento a la derecha, regla al medio */
  .rail .bl{display:flex; align-items:baseline; gap:8px; margin:.62vh 0 .22vh;}
  .rail .bl:first-child{margin-top:0;}
  .rail .bl b{font-family:'NectoMono',monospace; font-weight:400; font-size:min(.89vh,9.8px); letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink); min-width:0;}
  .rail .bl s{flex:1; text-decoration:none; border-bottom:1px solid rgba(17,17,17,.22); transform:translateY(-3px);}
  .rail .bl em{font-style:normal; font-family:'NectoMono',monospace; font-size:min(.78vh,8.6px);
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim); flex:none;}
  .rail.de i b{min-width:0; opacity:.5; margin-left:5px;}
  /* anillo de nivel: la órbita sobre la que flota cada estrato (los núcleos productivos también tienen la suya) */
  .cons .lvl-ring{fill:none; stroke:var(--ink); stroke-width:.8; stroke-opacity:.16; stroke-dasharray:1 7; pointer-events:none; opacity:0;}
  /* Ecosistema (instancia 03): las órbitas de cruces quedan como trama de fondo muy tenue — se leen como campo, no como línea.
     Al pasar el cursor por un área, SUS órbitas se encienden y las demás se apagan todavía más. */
  .cons .relx{fill:none; stroke:var(--ink); stroke-width:.9; stroke-dasharray:3 5; stroke-opacity:.22; pointer-events:none; opacity:0; transition:stroke-opacity .18s, stroke-width .18s;}
  .cons.dim .relx{stroke-opacity:.08;}
  .cons .relx.on{stroke-opacity:1 !important; stroke-width:1.7; stroke-dasharray:7 4; animation:electric-flow .7s linear infinite;}
  .cons .it .c{fill:var(--paper); stroke:var(--ink); stroke-width:1.1; transition:fill .2s;}
  .cons .it:hover .c,.cons .it:focus-visible .c,.cons .it.is-on .c{fill:var(--ink);}
  .cons .it:hover text,.cons .it:focus-visible text,.cons .it.is-on text{fill:var(--paper);}
  .cons .doc{fill:var(--ink); fill-opacity:.6; stroke:transparent; stroke-width:4;
    transform-box:fill-box; transform-origin:center; transition:fill-opacity .15s, transform .18s;}
  /* el punto del docente se enciende de verdad: crece y suelta un anillo que se expande (chispa) */
  .cons .doc:hover,.cons .doc.is-on{fill-opacity:1; transform:scale(2.8); animation:chispa .85s ease-out infinite;}
  @keyframes chispa{
    0%{stroke:rgba(17,17,17,.6); stroke-width:1.2;}
    75%{stroke:rgba(17,17,17,0); stroke-width:5.5;}
    100%{stroke:rgba(17,17,17,0); stroke-width:5.5;}
  }

  .legend2{border-top:1px solid var(--ink); padding-top:20px; display:grid; grid-template-columns:repeat(5,1fr); gap:26px 32px;}
  .legend2 .lg.g-proj{grid-column:span 2;}
  .legend2 .lg.g-proj ul{grid-template-columns:1fr 1fr; column-gap:28px;}
  .legend2 .lg.g-sig ul{grid-template-columns:1fr; }
  .legend2 .lg.g-leng ul{grid-template-columns:1fr; }
  .legend2 h4{font-family:'NectoMono',monospace; font-weight:400; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin-bottom:12px;}
  .legend2 ul{list-style:none; display:grid; gap:7px;}
  .legend2 li{display:flex; align-items:baseline; gap:12px; font-size:.8rem; line-height:1.35;}
  .legend2 li b{flex:none; min-width:52px; font-family:'NectoMono',monospace; font-weight:400; letter-spacing:.08em;}
  .legend2 .sym-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ink);}
  .legend2 .sym-cnv{display:inline-block; width:11px; height:11px; border-radius:50%; border:1.2px solid var(--ink);}
  .legend2 .sym-rel{display:inline-block; width:26px; border-top:1.2px dashed var(--ink); vertical-align:middle;}
  .legend2 .sym-proj{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1.2px solid var(--ink); font-style:normal; font-size:9px; letter-spacing:0;}
  /* símbolos del "Lenguaje visual": líneas de jerarquía por nivel + órbita de vínculo */
  .legend2 .line-l1{display:inline-block; width:28px; border-top:1.5px solid var(--ink); vertical-align:middle;}
  .legend2 .line-l2{display:inline-block; width:28px; border-top:1.1px solid var(--ink); vertical-align:middle; opacity:.72;}
  .legend2 .line-l3{display:inline-block; width:28px; border-top:.8px solid var(--ink); vertical-align:middle; opacity:.58;}
  .legend2 .sym-orb{display:inline-block; width:16px; height:16px; border:1.1px dashed var(--ink); border-radius:50%; vertical-align:middle;}
  /* Leyenda dentro del escenario · bloque dictado B2 -> J4 (72,72 -> 456,168) */

})();

  function addNode(spec){

  const MENNODE={grafico:'gr',industrial:'in',textil:'tx',interaccion:'id'};

    /* Dos columnas REPARTIDAS A MANO, no por flujo: con column-count el navegador cortaba una mención
       a media lista y su continuación aparecía arriba de la otra columna, bajo el título equivocado.
       Acá cada mención queda entera y rotulada; el reparto busca el par de columnas más parejo. */
    const colA=document.createElement('div'),colB=document.createElement('div');
    colA.className=colB.className='col';ld.append(colA,colB);
    const GRUPOS=[];
    const ORDEN=['grafico','industrial','textil','interaccion'];
    const fila=(d,extra)=>{

      it.append(document.createTextNode(d.n));
      if(extra){const b=document.createElement('b');b.textContent=extra;it.append(b);}

      it.addEventListener('mouseenter',()=>hlPersona(d.n,true));
      it.addEventListener('mouseleave',()=>hlPersona(d.n,false));
      /* una persona puede tener varias filas: se guardan todas para encenderlas juntas */

    ORDEN.forEach(m=>{
      const gente=DOCS.filter(d=>(d.ms||[d.a]).indexOf(m)>=0)
                      .sort((a,b)=>a.n.localeCompare(b.n,'es'));
      if(!gente.length)return;
      const g=document.createElement('div');g.className='grp';
      const u=document.createElement('u');
      u.textContent=BYID[MENNODE[m]].title+' ('+gente.length+')';g.append(u);
      gente.forEach(d=>{

        g.append(fila(d,otras.length?'+'+otras.map(x=>BYID[MENNODE[x]].short).join(' '):''));

    /* dirección y apoyo: no son docencia de mención pero sí parte del equipo */
    const resto=DOCS.filter(d=>!(d.ms||[d.a]).some(m=>MENNODE[m]))

      resto.forEach(d=>g.append(fila(d,'')));
      GRUPOS.push({g,n:resto.length+1});
    }
    /* Reparto: se prueban todas las combinaciones y gana la que deja la columna MÁS LARGA lo más corta
       posible. Cortar por el medio de la lista (minimizar la diferencia) dejaba 61 filas de un lado y
       se salían de la caja; lo que manda acá es el alto disponible, no la simetría. */
    {const n=GRUPOS.length;let mej=null,peor=1e9;
     for(let m=0;m<(1<<n);m++){
       let a=0,b=0;
       for(let i=0;i<n;i++)(m>>i&1)?b+=GRUPOS[i].n:a+=GRUPOS[i].n;
       const mx=Math.max(a,b);
       if(mx<peor||(mx===peor&&Math.abs(a-b)<Math.abs(mej.a-mej.b))){peor=mx;mej={m,a,b};}
     }
     GRUPOS.forEach((x,i)=>((mej.m>>i&1)?colB:colA).append(x.g));}

  /* al encender un ramo: se marcan sus docentes, sus puntos y las menciones donde se dicta */

    railsOff(on);
  }

  function hlDoc(dt,on){hlPersona(dt.d.n,on);}

  /* ---------- Medidas del contenido de cada celda, según el ancho del recuadro ---------- */
  nodes.forEach(o=>{o.cnt={proj:items.filter(it=>it.par===o&&it.x.kind==='proj').length,cnv:items.filter(it=>it.par===o&&it.x.kind==='cnv').length,doc:dots.filter(d=>d.par===o).length};});
  const NTR=[0,0,0,0];            // pistas de líneas sobre cada nivel
  {const seen=new Set();edges.forEach(e=>{const a=e.a,b=e.b;
    if(b.row===a.row+1){const k=b.row+'|'+a.id;if(!seen.has(k)){seen.add(k);NTR[b.row]++;}}
    else{NTR[a.row+1]++;NTR[b.row]++;}});}
  const nameF=bw=>Math.min(15,Math.max(10.5,bw*.145)),nmH=bw=>nameF(bw)*1.18*2+bw*.12;
  const met=bw=>{const arm=clamp(bw*.075,3,6),per=clamp(Math.floor(bw/5),5,11);
    return {R:bw*.42,arm,TS:clamp(bw*.065,4,5.2),DROP:arm+5,pad:clamp(bw*.06,3,5),sep:clamp(bw*.04,2,3),
      rp:clamp(bw*.115,6.2,10),gp:Math.min(2,bw*.03),rc:clamp(bw*.055,2.8,4.6),gc:1.3,per,dp:bw/per,rd:Math.min(2.4,bw/per*.34)};};
  const perRow=(bw,r,g)=>Math.max(1,Math.floor((bw+g)/(2*r+g)+1e-6));
  function unitH(o,bw,m){          // alto desde el borde superior de la celda
    let h=bw/2+m.R;if(o.kind!=='unit')return h;
    h+=m.pad;
    [['proj',m.rp,m.gp],['cnv',m.rc,m.gc]].forEach(([k,r,g])=>{const n=o.cnt[k];if(n)h+=Math.ceil(n/perRow(bw,r,g))*(2*r+g)+m.sep;});
    if(o.cnt.doc)h+=2*m.rd+(Math.ceil(o.cnt.doc/m.per)-1)*m.dp;
    return h;
  }
  const bandH=(li,m)=>li>3||!NTR[li]?0:m.DROP+NTR[li]*m.TS;
  const contH=(li,bw,m,cap)=>Math.max(cap&&li<2?1.5*bw+nameF(bw)*3.3:0,...nodes.filter(o=>o.row===li).map(o=>unitH(o,bw,m)));
  /* separación entre niveles: la del equipo, o la que necesita el organigrama si es mayor (así nada se mueve) */
  const gapAfter=(li,bw)=>{const m=met(bw);return Math.max(bw*.42,contH(li,bw,m,bw>=58)+bandH(li+1,m)+3-(1.5*bw+nmH(bw)));};

  function hl(o,on){
    o.g.classList.toggle('is-on',on);
    const prim=o.kind==='twin'?byId[o.n.id]:o;
    edges.forEach(e=>{if(e.a===o||e.b===o)e.path.classList.toggle('hot',on);});
    /* al pasar el cursor por un área, SUS órbitas de cruce se encienden y el resto del campo se apaga */
    const mine=rels.filter(r=>r.a===prim||r.b===prim);
    mine.forEach(r=>{r.path.classList.toggle('on',on);(r.a===prim?r.b:r.a).g.classList.toggle('rel',on);});
    svg.classList.toggle('dim',on&&mine.length>0);
  }
  function hlItem(it,on){
    it.g.classList.toggle('is-on',on);
    const other=it.x.kind==='proj'?cnvOfProj[it.x.id]:projOfCnv[it.x.id];
    (other||[]).forEach(id=>byId[id].g.classList.toggle('is-on',on));
  }

  /* ---------- Medidas: dónde va el equipo (a) y dónde va el organigrama (b) ---------- */
  let PORT=false,MOVE=false,A0=.07,GAPX=16,TS=5,DROP=6,cellY=[0,0,0,0],BW=75;
  const ES=.94;   /* instancia 03: los círculos se achican al migrar, porque los anillos del ecosistema son más apretados que la grilla */
  const EC={x:0,y:0};   /* centro del sistema orbital (instancia 03) */
  /* Deriva angular POR ANILLO: cada nivel gira un poco como bloque, con su propia fase y velocidad.
     Al ser conjunta, los módulos de un mismo anillo nunca se alcanzan entre sí. */
  const RING=[{ph:0.0,w:.45},{ph:2.1,w:.55},{ph:4.3,w:.38},{ph:1.2,w:.32}];
  const ARCPX=34;
  const SEP=26;   /* aire mínimo entre dos módulos vecinos: nunca se tocan, ni flotando */
  /* Si la suma de arcos que piden todos los módulos pasa de 360°, el anillo NO da: por mucho que se
     reparta, alguien se superpone. EK achica módulos y halos lo justo para que quepan; se calcula solo. */
  let EK=1;       /* amplitud de la deriva angular, en píxeles de arco */
  /* Halo de docentes (instancia 03): cada área lleva a sus docentes orbitándola, como en la constelación original. */
  const DPR=10,DGAP=5.2;                                    /* docentes por anillo del halo · separación entre anillos */
  const haloOf=o=>{const n=(o.cnt&&o.cnt.doc)||0;return n?(Math.ceil(n/DPR)*DGAP+6)*EK:0;};
  function place(){
    /* el alto del encabezado se mide con el texto más largo, para que la grilla no cambie de lugar entre pasos */
    const keep=stepT.textContent;stepT.textContent=STEPS[1][1];
    const W=stage.clientWidth,H=stage.clientHeight,top0=(topEl.offsetParent?topEl.offsetHeight:0)+14;
    stepT.textContent=keep;
    PORT=W<760;stage.classList.toggle('port',PORT);
    const groups=LEVELS.map(L=>L.g.map(k=>CARDS.filter(c=>c.key===k)));
    const added=li=>nodes.filter(o=>!o.card&&o.row===li);
    const count=li=>groups[li].reduce((a,g)=>a+g.length,0)+added(li).length;
    let names=true;
    if(!PORT){
      /* el recuadro más grande (máx. 100 px) que deja ver los cuatro niveles en una pantalla */
      const side=32,availW=W-2*side,availH=H-top0-30,lblW=170;
      const rowW=(li,bw,gap)=>{const n=count(li);return n*bw+(n-1)*gap+(groups[li].length-1)*gap*2;};
      const hOf=bw=>4*(1.5*bw+nmH(bw))+gapAfter(0,bw)+gapAfter(1,bw)+gapAfter(2,bw);
      let bw=100;
      for(;bw>40;bw-=1){const gap=bw*.22;if(Math.max(...LEVELS.map((_,li)=>rowW(li,bw,gap)))+28+lblW<=availW&&hOf(bw)<=availH)break;}
      const gap=bw*.22;
      const widest=Math.max(...LEVELS.map((_,li)=>rowW(li,bw,gap))),x0=Math.max(side,(W-(widest+28+lblW))/2);
      let y=top0+Math.max(0,(availH-hOf(bw))/2);
      groups.forEach((gs,li)=>{
        let x=x0;
        gs.forEach((g,gi)=>{if(gi)x+=gap*2;g.forEach(c=>{c.a={x,y,bw};c.b={x,y,bw};x+=bw+gap;});});
        lv[li].a={x:x-gap+28,y:y+.75*bw};
        added(li).forEach(o=>{o.cell={x,y,bw};x+=bw+gap;});
        lv[li].b={x:x0+widest+28,y:y+.75*bw};
        cellY[li]=y;y+=1.5*bw+nmH(bw)+(li<3?gapAfter(li,bw):0);
      });
      MOVE=false;BW=bw;GAPX=gap;
      /* Instancia 02 = organigrama ortogonal clásico (mismas celdas que la grilla del equipo). La constelación radial queda para el momento D3 futuro. */
    }else{
      /* celular · equipo: recuadros compactos que se envuelven por nivel */
      const side=14,availW=W-2*side,availH=H-top0-22,lblH=24;
      const fit=bw=>{const gap=bw*.22,c=Math.max(1,Math.floor((availW+gap)/(bw+gap))),nm=bw>=58,nameH=nm?nameF(bw)*1.18*2+8:6;
        let h=0;groups.forEach(gs=>{const n=gs.reduce((a,g)=>a+g.length,0),r=Math.ceil(n/c);h+=lblH+r*(1.5*bw+nameH)+(r-1)*gap;});h+=3*14;
        return {ok:h<=availH,c,nm,nameH,gap};};
      let bw=110,f=fit(bw);for(;bw>28;bw-=1){f=fit(bw);if(f.ok)break;}
      names=f.nm;
      let y=top0;
      groups.forEach((gs,li)=>{
        lv[li].a={x:side,y};y+=lblH;
        const list=gs.flat();
        list.forEach((c,k)=>{c.a={x:side+(k%f.c)*(bw+f.gap),y:y+Math.floor(k/f.c)*(1.5*bw+f.nameH+f.gap),bw};});
        const r=Math.ceil(list.length/f.c);y+=r*(1.5*bw+f.nameH)+(r-1)*f.gap+14;
      });
      /* celular · organigrama: una fila por nivel, con aire debajo de cada círculo para su contenido */
      const cols=Math.max(...LEVELS.map((_,li)=>count(li))),bw2=availW/(cols+(cols-1)*.22),gap2=bw2*.22,m2=met(bw2),ys=[];
      let y2=top0;
      LEVELS.forEach((_,li)=>{ys.push(y2);y2+=20+(bandH(li,m2)||4)+contH(li,bw2,m2,false)+8;});
      const extra=clamp((top0+availH-y2)/3,0,34);
      groups.forEach((gs,li)=>{
        const rt=ys[li]+li*extra;let x=side;
        lv[li].b={x:side,y:rt};cellY[li]=rt+20+(bandH(li,m2)||4);
        gs.flat().forEach(c=>{c.b={x,y:cellY[li],bw:bw2};x+=bw2+gap2;});
        added(li).forEach(o=>{o.cell={x,y:cellY[li],bw:bw2};x+=bw2+gap2;});
      });
      MOVE=true;BW=bw2;GAPX=gap2;
    }
    A0=MOVE?.17:.07;
    const bw1=CARDS[0].a.bw;
    CARDS.forEach(c=>{c.name.style.fontSize=nameF(bw1).toFixed(1)+'px';c.name.style.width=bw1+'px';c.name.style.display=names?'':'none';});
    layout();
    frame(performance.now(),true);
  }

  /* trazo ortogonal con esquinas redondeadas */
  function rpath(P,rad){
    const Q=P.filter((p,i)=>!i||Math.hypot(p[0]-P[i-1][0],p[1]-P[i-1][1])>.5);
    let d=`M${Q[0][0].toFixed(1)} ${Q[0][1].toFixed(1)}`;
    for(let i=1;i<Q.length-1;i++){
      const [x0,y0]=Q[i-1],[x1,y1]=Q[i],[x2,y2]=Q[i+1],l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),r=Math.min(rad,l1/2,l2/2);
      d+=`L${(x1-(x1-x0)/l1*r).toFixed(1)} ${(y1-(y1-y0)/l1*r).toFixed(1)}Q${x1.toFixed(1)} ${y1.toFixed(1)} ${(x1+(x2-x1)/l2*r).toFixed(1)} ${(y1+(y2-y1)/l2*r).toFixed(1)}`;
    }
    const L=Q[Q.length-1];return d+`L${L[0].toFixed(1)} ${L[1].toFixed(1)}`;
  }
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));

  /* ---------- Organigrama sobre la grilla: círculos, contenido bajo cada uno y líneas ---------- */
  function layout(){
    const bw=BW,W=stage.clientWidth,H=stage.clientHeight;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const m=met(bw),R=m.R,arm=m.arm,fSig=clamp(bw*.17,7.5,14),capF=nameF(bw),showCap=bw>=58;
    TS=m.TS;DROP=m.DROP;
    const rows=[[],[],[],[]];
    nodes.forEach(o=>{if(o.card)o.cell=o.card.b;rows[o.row].push(o);});
    rows.forEach(r=>{r.sort((a,b)=>a.cell.x-b.cell.x);r.forEach((o,i)=>o.col=i);});
    /* Jerarquía por nivel: el radio baja de nivel 01 a 04 (nivel 04 queda como punto). Todos los módulos llevan SIGLA,
       porque el nombre completo se desborda del círculo; el nombre va en la leyenda y en el pop-up. */
    const RM=[1.40,1.28,1.08,0.30];
    nodes.forEach(o=>{
      const c=o.cell,row=o.row,mult=o.kind==='staff'?1.05:RM[row];
      o.r=(o.kind==='staff'?bw*.3:R)*mult/RM[2];
      o.cx=c.x+bw/2;o.cy=c.y+bw/2;o.oX=o.cx;o.oY=o.cy;   /* posición ortogonal (instancia 02) */
      o.g.setAttribute('transform',`translate(${o.cx.toFixed(1)} ${o.cy.toFixed(1)})`);
      o.circ.setAttribute('r',o.r.toFixed(1));
      /* sigla adentro del círculo, dimensionada contra el radio del módulo (nivel 04 queda sin texto) */
      const label=row===3?'':(o.n?o.n.short:o.sigla||'');
      o.txt.textContent=label;
      if(label){
        const fit=o.r*1.62/Math.max(2,label.length),fs=Math.max(8,Math.min(o.r*.62,fit));
        o.txt.setAttribute('font-size',fs.toFixed(1));
        o.txt.style.textTransform='uppercase';o.txt.style.letterSpacing='.04em';
      }
      /* cruces: donde estaban las esquinas superiores del recuadro */
      const nx=rows[o.row][o.col+1],endG=!nx||nx.cell.x-c.x>bw+GAPX+1;
      [[c.x,c.y],[c.x+bw,c.y]].forEach(([x,y],k)=>{
        const h=o.crzL[k*2],v=o.crzL[k*2+1];h.style.display=v.style.display=k&&!endG?'none':'';
        h.setAttribute('x1',x-arm);h.setAttribute('x2',x+arm);h.setAttribute('y1',y);h.setAttribute('y2',y);
        v.setAttribute('x1',x);v.setAttribute('x2',x);v.setAttribute('y1',y-arm);v.setAttribute('y2',y+arm);
      });
      if(o.cap){o.cap.style.display=showCap?'':'none';o.cap.style.width=bw+'px';o.cap.style.fontSize=capF.toFixed(1)+'px';
        o.cap.style.transform=`translate(${c.x.toFixed(1)}px,${(c.y+1.5*bw+.9*capF).toFixed(1)}px)`;}
      o.delay=o.row*.035+o.col*.006;
    });

    /* ---------- Instancia 03 · Ecosistema: disposición radial donde cada área se acopla a la órbita a la que pertenece.
       Los pares con vínculo quedan angularmente contiguos (o alineados radialmente) para que su órbita salga limpia:
       TE adyacente a CL/CI y a 90° de CP · MC junto a CL · CP y LINC en el mismo radio · ADM y LAB 360 en el mismo radio. ---------- */
    const P3=(deg,rr)=>[rr*Math.sin(deg*Math.PI/180),-rr*Math.cos(deg*Math.PI/180)];
    /* Layout radial de árbol. Dos reglas, para que la posición no diga nada que no sea cierto:
       · el RADIO lo fija el nivel jerárquico (y solo eso) → todas las áreas de un mismo nivel equidistan del centro;
       · el ÁNGULO de cada rama es proporcional al tamaño de su subárbol → ninguna rama se ve más "incluida" por azar.
       Las órbitas de colaboración cruzan el árbol libremente: esa es justamente la capa que no sigue la jerarquía. */
    const RAD3=[0,1.28,2.00,2.60];
    const POS3={};
    const stf=nodes.filter(o=>o.kind==='staff').map(o=>o.id);
    /* El reparto angular depende de la escala: el arco que un módulo necesita para no pisar a su vecino
       se mide en píxeles (su radio + su halo), y cuántos grados son esos píxeles depende de cuán grande
       salga el sistema. Por eso NO se puede repartir de una vez con una escala tentativa: se reparte,
       se encaja, y con la escala real se vuelve a repartir, hasta que ambas cosas concuerdan. */
    const repartir=SC=>{
      const isStf=id=>stf.indexOf(id)>=0;
      const kids={},byI={};nodes.forEach(o=>{kids[o.id]=[];byI[o.id]=o;});
      edges.forEach(e=>{if(kids[e.a.id]&&!isStf(e.b.id))kids[e.a.id].push(e.b.id);});
      const rowOf=id=>Math.min(3,(byI[id]&&byI[id].row)||0);
      /* arco mínimo de un módulo para no tocar al vecino: su diámetro, su halo de docentes y un aire */
      const minDeg=id=>{const o=byI[id],rr=RAD3[rowOf(id)]*SC;
        return rr<=0?0:(2*(o.r*ES*EK+haloOf(o))+SEP)/rr*180/Math.PI;};
      const dem={};
      (function need(id){const k=kids[id]||[],own=minDeg(id);
        if(!k.length)return dem[id]=own;
        let s=0;k.forEach(c=>s+=need(c));return dem[id]=Math.max(own,s);})('dir');
      /* Reparto proporcional PERO con mínimos garantizados. El reparto puro repartía la falta entre
         todos por igual, y los módulos sin hijos (TE, CE) terminaban con menos grados que su propio
         diámetro: se tocaban. Acá nadie baja de su mínimo; lo que falta se le quita a quien va holgado. */
      const share=(tot,ids)=>{
        const mins=ids.map(i=>minDeg(i)),w=ids.map(i=>dem[i]||1);
        const sw=w.reduce((a,b)=>a+b,0)||1;
        let out=ids.map((_,i)=>tot*w[i]/sw);
        for(let k=0;k<8;k++){
          let falta=0,holgura=0;
          out.forEach((v,i)=>{if(v<mins[i])falta+=mins[i]-v;else holgura+=v-mins[i];});
          if(falta<1e-6||holgura<=1e-6)break;
          const f=Math.min(1,falta/holgura);
          out=out.map((v,i)=>v<mins[i]?mins[i]:v-(v-mins[i])*f);
        }
        return out;};
      (function put(id,a0,a1){
        POS3[id]=id==='dir'?[0,0]:P3((a0+a1)/2,RAD3[rowOf(id)]);
        const k=kids[id]||[];if(!k.length)return;
        const ws=share(a1-a0,k);let a=a0;
        k.forEach((c,i)=>{put(c,a,a+ws[i]);a+=ws[i];});
      })('dir',0,360);
      /* el staff de dirección va en una corona interior propia: acompaña a DIR, no compite con las coordinaciones */
      stf.forEach((id,i)=>POS3[id]=P3(45+i*(360/Math.max(1,stf.length)),.62));
      return dem['dir']||0;   /* cuántos grados pide el conjunto: si pasa de 360, no cabe */
    };
    {
      const hT=(topEl.offsetParent?topEl.offsetHeight:0)+14,mg0=8;
      const maxR0=Math.max(...nodes.map(n=>n.r))*ES;
      repartir(Math.min((W/2-mg0-maxR0)/RAD3[3],((H-hT)/2-mg0-maxR0)/RAD3[3]));
    }
    {
      const hTop=(topEl.offsetParent?topEl.offsetHeight:0)+14;   /* alto del encabezado (top0 vive en place(), acá se recalcula) */
      const mg=8,maxR=Math.max(...nodes.map(n=>n.r*ES*EK+haloOf(n)));   /* el halo de docentes también ocupa */
      /* Bloque dictado para el ecosistema: O5 -> AH23 (648,216 -> 1608,1080), en porcentaje del panel,
         para que en pantalla completa quede centrado en su banda y no se descuelgue hacia abajo.
         Es la franja libre entre las dos listas; medirlo contra el ancho total hundía los módulos
         del anillo externo bajo el texto y cortaba sus círculos. */
      let bL=.3222*W,bR=.7222*W,bT=.2444*H,bB=.9556*H;   /* O6 -> AG22 sobre un panel de referencia 2160x1080 */
      if(W<900){bL=0;bR=W;bT=hTop;bB=H;}                 /* en pantallas angostas las listas no flanquean */
      /* el límite lo tiene que respetar el dibujo EN MOVIMIENTO, no solo en reposo: se reserva la deriva
         del anillo (ARCPX de arco) más el bamboleo radial, si no los módulos salen del bloque al flotar. */
      const DRIFT=ARCPX+12;
      const avX=(bR-bL)/2-mg-maxR-DRIFT,avY=(bB-bT)/2-mg-maxR-DRIFT;
      /* ESCALA UNIFORME, nunca elíptica: estirar en X rompería la equidistancia del anillo y haría que unas áreas
         parezcan "más cerca del centro" que sus pares del mismo nivel. La distancia al centro significa nivel, y solo eso.
         Lo que sí se puede hacer sin mentir es GIRAR el conjunto: la rotación no altera ninguna relación,
         y permite acomodar la nube al canvas (que es mucho más ancho que alto). */
      /* se mide la caja REAL de la nube (min/max), no su extensión simétrica: la rama que más pide
         no está enfrentada a otra igual, así que centrar por el eje dejaba aire arriba y el dibujo caído. */
      const avW=2*avX,avH=2*avY;
      /* arranque: una escala aproximada medida solo con los módulos, para que el ajuste fino tenga de dónde partir */
      const arranque=()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
        Object.values(POS3).forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];});
        return Math.min(avW/Math.max(1e-6,x1-x0),avH/Math.max(1e-6,y1-y0));};
      /* Ajuste fino: la reserva de arriba (radio máximo + deriva para TODOS) es conservadora, porque el
         módulo más grande nunca coincide con el instante de máxima deriva en el borde. Acá se mide la
         huella real del dibujo EN MOVIMIENTO —cada módulo con su propio radio, su halo y su recorrido—
         y se agranda hasta tocar el bloque. Así el ecosistema llena su caja sin salirse nunca de ella. */
      /* La huella incluye TODO lo que se ve: los módulos con su halo y su recorrido, los anillos de nivel
         y —sobre todo— las órbitas de colaboración, que son círculos enormes y son las que de verdad
         definen la mancha. Dejarlas fuera del cálculo hacía que el dibujo se leyera descentrado y que
         una órbita se metiera bajo la lista de docentes. */
      const huella=(sc,quieto,rc,rs)=>{
        const rot=p=>[p[0]*rc-p[1]*rs,p[0]*rs+p[1]*rc];
        let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
        const ensancha=(cx,cy,R)=>{
          if(cx-R<x0)x0=cx-R;if(cx+R>x1)x1=cx+R;
          if(cy-R<y0)y0=cy-R;if(cy+R>y1)y1=cy+R;};
        const DR=quieto?0:ARCPX+9;              /* lo que cada módulo puede desplazarse al flotar */
        const pos={};
        nodes.forEach(o=>{const p0=POS3[o.id];if(!p0)return;
          const p=rot(p0);pos[o.id]=[p[0]*sc,p[1]*sc];
          const R=o.r*ES*EK+haloOf(o);
          const rad=Math.hypot(p[0],p[1])*sc,ang=Math.atan2(p[0],-p[1]);
          const amp=quieto?0:(rad>0?9:3),da=quieto||rad<=0?0:ARCPX/rad;
          for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
            const rr=rad+i*amp,aa=ang+j*da;
            ensancha(rr*Math.sin(aa),-rr*Math.cos(aa),R);}});
        RAD3.forEach((r,i)=>ensancha(0,0,(i===0?.62:r)*sc));          /* anillos de nivel */
        rels.forEach(r=>{const a=pos[r.a.id],b=pos[r.b.id];if(!a||!b)return;
          ensancha((a[0]+b[0])/2,(a[1]+b[1])/2,Math.hypot(b[0]-a[0],b[1]-a[1])/2+DR);});
        return {x0,x1,y0,y1,w:x1-x0,h:y1-y0};};
      const capW=(bR-bL)-2*mg,capH=(bB-bT)-2*mg,CXb=(bL+bR)/2,CYb=(bT+bB)/2;
      /* La rotación se elige midiendo la huella COMPLETA, no solo los módulos: girar no altera ninguna
         relación del diagrama, pero sí decide hacia dónde apuntan los bultos de las órbitas, que son
         los que topan con el bloque. Eligiendo el giro con la nube entera el conjunto entra más grande. */
      const buscar=()=>{
        const SC0=arranque();let rot=0,best=0;
        for(let d=0;d<180;d+=3){
          const rc=Math.cos(d*Math.PI/180),rs=Math.sin(d*Math.PI/180);
          let sc=SC0;
          for(let k=0;k<7;k++){const m=huella(sc,false,rc,rs);
            const r=Math.min(capW/Math.max(1e-6,m.w),capH/Math.max(1e-6,m.h));
            if(Math.abs(r-1)<.004)break;
            sc*=1+(r-1)*.85;}
          const m=huella(sc,false,rc,rs);
          if(m.w>capW||m.h>capH)sc*=Math.min(capW/m.w,capH/m.h);
          if(sc>best){best=sc;rot=d;}
        }
        return {rot,sc:best};};
      /* Reparto y escala se persiguen: con la escala real, el arco que cada módulo necesita cambia.
         Tres vueltas bastan para que converjan y ningún módulo quede pisando a su vecino. */
      let R0=buscar();
      for(let v=0;v<6;v++){
        const pide=repartir(R0.sc);
        /* si el conjunto pide más de una vuelta completa, los módulos se achican lo justo y se vuelve a probar */
        if(pide>352){EK=Math.max(.45,EK*352/pide);repartir(R0.sc);}
        const n=buscar();
        const quieto=Math.abs(n.sc-R0.sc)/R0.sc<.004&&pide<=352;
        R0=n;if(quieto)break;}
      repartir(R0.sc);
      const ROT=R0.rot,RC=Math.cos(ROT*Math.PI/180),RS=Math.sin(ROT*Math.PI/180);
      let SC3=R0.sc;
      /* Dos medidas distintas, porque hacen dos cosas distintas:
         · CENTRAR se hace con la mancha QUIETA — es la que el ojo ve y la que se compara con las listas;
           centrar con la holgura de flotación incluida corría el dibujo hacia arriba.
         · CONTENER se hace con la holgura puesta, para que al flotar nada salga del bloque. */
      /* El tamaño lo fija el ANCHO de la mancha con holgura, no su distancia al centro: exigir que
         quepa de forma simétrica alrededor del centro óptico desperdiciaba todo lo que la mancha es
         asimétrica, y el dibujo quedaba chico. Acá se usa la caja completa. */
      const encaje=sc=>{const m=huella(sc,false,RC,RS);
        return Math.min(capW/Math.max(1e-6,m.w),capH/Math.max(1e-6,m.h));};
      for(let k=0;k<12;k++){const r=encaje(SC3);
        if(Math.abs(r-1)<.002)break;
        SC3*=1+(r-1)*.8;}
      const rf=encaje(SC3);if(rf<1)SC3*=rf;                     /* nunca más ancho que el bloque */
      /* Centrado: se apunta al centro de la mancha QUIETA (la que el ojo compara con las listas) y
         después se corre lo mínimo indispensable para que la mancha EN MOVIMIENTO no pise el bloque. */
      const q=huella(SC3,true,RC,RS),m=huella(SC3,false,RC,RS);
      const clampa=(c,lo,hi,a,b)=>{let v=c;if(v+a<lo)v=lo-a;if(v+b>hi)v=hi-b;return v;};
      const CX3=clampa(CXb-(q.x0+q.x1)/2,bL+mg,bR-mg,m.x0,m.x1),
            CY3=clampa(CYb-(q.y0+q.y1)/2,bT+mg,bB-mg,m.y0,m.y1);
      EC.x=CX3;EC.y=CY3;
      nodes.forEach(o=>{const p0=POS3[o.id],p=p0?[p0[0]*RC-p0[1]*RS,p0[0]*RS+p0[1]*RC]:null;
        if(p){o.eX=CX3+p[0]*SC3;o.eY=CY3+p[1]*SC3;
              o.eRad=Math.hypot(p[0],p[1])*SC3;o.eAng=Math.atan2(p[0],-p[1]);}
        else{o.eX=o.oX;o.eY=o.oY;o.eRad=0;o.eAng=0;}
        /* bamboleo radial individual, derivado del id: estable entre resizes y distinto en cada módulo */
        const h=Math.abs([...o.id].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7));
        o.ring=Math.min(3,o.row||0);
        o.phR=(h%628)/100;                 /* fase */
        o.wR=.40+((h>>7)%40)/100;          /* 0.40–0.80 rad/s → ciclo de 8 a 16 s */
        o.ampR=5+((h>>5)%5);               /* 5–9 px de acercarse y alejarse del centro */
      });
      /* un anillo por nivel; el de nivel 01 usa el radio de la corona de staff */
      lvlRings.forEach((c,i)=>{const rr=(i===0?.62:RAD3[i])*SC3;
        c.setAttribute('cx',CX3.toFixed(1));c.setAttribute('cy',CY3.toFixed(1));c.setAttribute('r',rr.toFixed(1));});
    }

    /* contenido bajo cada círculo: proyectos, convenios y docentes */
    const {rp,gp,rc,gc,per,dp,rd}=m;
    const rowsOf=(list,r,g)=>{const n=perRow(bw,r,g);return list.map((it,i)=>[i%n,Math.floor(i/n)]);};
    nodes.filter(o=>o.kind==='unit').forEach(o=>{
      let y=o.cy+o.r+m.pad;const x0=o.cell.x,t0=A0+.62+o.row*.02+o.col*.004;
      [['proj',rp,gp],['cnv',rc,gc]].forEach(([kind,r,g])=>{
        const list=items.filter(it=>it.par===o&&it.x.kind===kind);if(!list.length)return;
        const pos=rowsOf(list,r,g);
        list.forEach((it,i)=>{it.r=r;it.px=x0+r+pos[i][0]*(2*r+g);it.py=y+r+pos[i][1]*(2*r+g);it.t0=t0+i*.006;
          it.g.querySelector('circle').setAttribute('r',r.toFixed(1));if(it.txt)it.txt.setAttribute('font-size',(r*.98).toFixed(1));});
        y+=(pos[pos.length-1][1]+1)*(2*r+g)+m.sep;
      });
      const mine=dots.filter(d=>d.par===o);
      mine.forEach((d,i)=>{
        d.c.setAttribute('r',rd.toFixed(2));
        /* posición ortogonal: matriz de puntos bajo el área */
        d.oX=x0+dp*(i%per+.5);d.oY=y+rd+Math.floor(i/per)*dp;
        d.c.setAttribute('cx',d.oX.toFixed(1));d.c.setAttribute('cy',d.oY.toFixed(1));
        d.t0=t0+.04+i*.0012;
        /* posición orbital (instancia 03): anillos de docentes alrededor de su área */
        const ring=Math.floor(i/DPR),inR=i%DPR,cntR=Math.min(DPR,mine.length-ring*DPR);
        d.hAng=(inR+.5)/cntR*Math.PI*2+ring*.42;
        d.hRad=o.r*ES*EK+7+ring*DGAP*EK;
        d.spin=(ring%2?1:-1)*(.055+.03*(o.id.length%3));   /* anillos contiguos giran en sentidos opuestos */
      });
    });

    /* líneas: salen por el costado izquierdo del círculo, bajan por el canal entre columnas,
       corren sobre el nivel siguiente y entran a cada círculo por arriba */
    const gut=o=>o.cell.x-GAPX/2,parents=new Set(edges.map(e=>e.a));
    const bands=[[],[],[],[]],busOf=new Map();
    /* Un único bus (puente) por banda: todas las ramas de ese nivel comparten la misma línea horizontal.
       Para los edges que saltan niveles ('via') conservamos un bus separado para que no se confundan con las ramas directas. */
    const bus=(row,key,stemX)=>{const direct=!key||key[0]!=='v'&&key[0]!=='w',k=row+'|'+(direct?'main':key);
      if(!busOf.has(k)){const b={stemX,xs:[]};busOf.set(k,b);bands[row].push(b);}return busOf.get(k);};
    const viaUse={};
    edges.forEach(e=>{
      const a=e.a,b=e.b;
      if(b.row===a.row+1){e.b1=bus(b.row,a.id,gut(a));e.b1.xs.push(b.cx);e.b2=null;}
      else{
        /* salta un nivel: baja por un canal libre del nivel intermedio */
        const mid=rows[a.row+1],cand=[];
        for(let i=0;i<=mid.length;i++){
          if(i<mid.length&&parents.has(mid[i]))continue;
          const x=i===0?gut(mid[0]):i===mid.length?mid[i-1].cell.x+bw+GAPX/2:(mid[i-1].cell.x+bw+mid[i].cell.x)/2;
          cand.push({x,w:i&&i<mid.length?mid[i].cell.x-mid[i-1].cell.x-bw:GAPX,c:Math.abs(x-gut(a))+Math.abs(x-b.cx)});
        }
        cand.sort((p,q)=>(p.c-q.c)||(q.w-p.w));
        const g=cand[0],key=g.x.toFixed(0);viaUse[key]=(viaUse[key]||0)+1;
        e.via=g;e.viaK=viaUse[key]-1;e.viaKey=key;
      }
    });
    edges.filter(e=>e.via).forEach(e=>{
      const n=viaUse[e.viaKey],sp=Math.min(7,e.via.w/(n+1)),x=e.via.x+(e.viaK-(n-1)/2)*sp;
      /* el bus del salto se comparte por padre y fila de destino (no por pareja): si no, dos hijos del mismo
         padre abrían dos pistas casi pegadas y el tramo padre→bus se dibujaba dos veces (líneas dobles) */
      e.vx=x;e.b1=bus(e.a.row+1,'v'+e.a.id+'@'+e.b.row,gut(e.a));e.b1.xs.push(x);
      e.b2=bus(e.b.row,'w'+e.a.id+'@'+e.b.row,x);e.b2.xs.push(e.b.cx);
    });
    /* orden de las pistas de cada franja: el que menos cruces produce */
    bands.forEach(list=>{
      if(!list.length)return;
      list.forEach(b=>{b.lo=Math.min(b.stemX,...b.xs);b.hi=Math.max(b.stemX,...b.xs);});
      const inside=(x,b)=>x>b.lo+1&&x<b.hi-1;
      let best=null,bc=1e9;
      perms(list).forEach(p=>{                       // p[0] = pista más baja
        let c=0;
        for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
          if(inside(p[i].stemX,p[j]))c++;
          p[j].xs.forEach(x=>{if(inside(x,p[i]))c++;});
        }
        if(c<bc){bc=c;best=p;}
      });
      best.forEach((b,k)=>b.k=k);
    });
    const ty=(row,b)=>cellY[row]-DROP-b.k*TS,rad=clamp(bw*.07,3,5.5);
    const bandT=[0,.38,.44,.50];   /* edges de jerarquía escalonados: bus 1 arranca cuando los círculos ya aparecieron */
    /* Jerarquía ortogonal con dedupe de caminos: cada tramo padre→bus se dibuja UNA sola vez (compartido entre hermanos); solo cambian las ramas bus→hijo. */
    const stems=new Set();
    edges.forEach(e=>{
      const a=e.a,b=e.b,gx=gut(a);
      let P;
      if(!e.via){
        const by=ty(b.row,e.b1),stemKey=a.id+'@'+by.toFixed(1);
        if(stems.has(stemKey)){P=[[gx,by],[b.cx,by],[b.cx,b.cy-b.r]];}
        else{stems.add(stemKey);P=[[a.cx-a.r,a.cy],[gx,a.cy],[gx,by],[b.cx,by],[b.cx,b.cy-b.r]];}
      }else{
        const by1=ty(a.row+1,e.b1),by2=ty(b.row,e.b2),stemKey=a.id+'@'+by1.toFixed(1);
        const tail=[[e.vx,by1],[e.vx,by2],[b.cx,by2],[b.cx,b.cy-b.r]];
        if(stems.has(stemKey)){P=[[gx,by1],...tail];}
        else{stems.add(stemKey);P=[[a.cx-a.r,a.cy],[gx,a.cy],[gx,by1],...tail];}
      }
      e.path.setAttribute('d',rpath(P,rad));
      e.t0=A0+bandT[a.row+1];e.dur=e.via?.18:.13;
      if(!b.card)b.t0=e.t0+e.dur-.03;
    });
    bead.style.display='';   /* la 'd' la escribe frame(): son radios DIR→equipo, y los círculos se mueven */
    /* Órbitas: una circunferencia por vínculo. Centro = punto medio del par, radio = mitad de la distancia entre centros.
       Cada órbita pasa por sus dos áreas en extremos opuestos del diámetro → simetría total respecto al centro. */
    rels.forEach(r=>{
      const a=r.a,b=r.b,cx=(a.cx+b.cx)/2,cy=(a.cy+b.cy)/2,rad=Math.hypot(b.cx-a.cx,b.cy-a.cy)/2;
      r.path.setAttribute('cx',cx.toFixed(1));r.path.setAttribute('cy',cy.toFixed(1));r.path.setAttribute('r',rad.toFixed(1));
    });
  }

  /* ---------- Pop-up del organigrama ---------- */
  function rowsDl(dl,list){list.forEach(([k,v])=>{if(!v||(Array.isArray(v)&&!v.length))return;D.add(dl,'dt',null,k);
    const dd=D.add(dl,'dd');if(Array.isArray(v)){const ul=D.add(dd,'ul');v.forEach(t=>D.add(ul,'li',null,t));}else dd.textContent=v;});}
  function fillNode(n){
    /* Diagrama 03 · equipo humano: la ficha del área muestra quién coordina, cuántos docentes y con qué otras áreas se vincula. Proyectos y convenios se verán en otro diagrama. */
    const P=D.pop;
    D.add(P,'div','ptag',n.tag);D.add(P,'h3',null,n.title);
    const dc=DOCCOUNT[n.id],vin=REL.filter(r=>r.a===n.id||r.b===n.id).map(r=>BYID[r.a===n.id?r.b:r.a].title);
    rowsDl(D.add(P,'dl'),[['Coordina',n.coord],['Docentes',dc?String(dc):''],['Vínculos',vin]]);
  }
  /* nombre → slug del archivo en assets/img/docentes/ (sin tildes, minúsculas, con guiones) */
  const docSlug=n=>n.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  function fillDoc(d){
    const P=D.pop;
    const face=D.add(P,'div','face');
    const img=document.createElement('img');img.loading='lazy';img.alt='';
    img.onerror=()=>face.classList.add('no');
    img.src='../assets/img/docentes/'+docSlug(d.n)+'.jpg';
    face.append(img);
    D.add(P,'div','ptag',d.c||(d.t==='planta'?'Docente de planta':'Docente part-time'));
    D.add(P,'h3',null,d.n);
    rowsDl(D.add(P,'dl'),[['Formación',d.p&&d.p!=='—'?d.p:''],['Postgrado',d.g],['Cursos',d.cs]]);
  }

  /* ---------- Leyenda: siglas agrupadas por nivel + lenguaje visual que explica líneas y órbitas ---------- */
  function buildLegend(){
    if(legendEl)legendEl.textContent='';
    const grp=(title,cls)=>{const g=document.createElement('div');g.className='lg '+(cls||'');const h=document.createElement('h4');h.textContent=title;g.append(h);const ul=document.createElement('ul');g.append(ul);legendEl.append(g);return ul;};
    const item=(ul,key,text,id,sym)=>{const li=document.createElement('li');
      const b=document.createElement('b');if(sym)b.innerHTML=sym;else b.textContent=key;li.append(b);
      const sp=document.createElement('span');sp.textContent=text;li.append(sp);ul.append(li);
      if(id&&byId[id]){li.addEventListener('mouseenter',()=>byId[id].g.classList.add('is-on'));li.addEventListener('mouseleave',()=>byId[id].g.classList.remove('is-on'));}};
    /* Siglas agrupadas por nivel (así se lee de un vistazo quién pertenece a qué) */
    if(legendEl){
      const LVLN=['Nivel 01 · Dirección','Nivel 02 · Coordinaciones','Nivel 03 · Menciones y Vinculación con el Medio','Nivel 04 · Núcleos productivos'];
      const uls=LVLN.map(t=>grp(t,'g-sig'));
      nodes.filter(o=>o.kind==='unit').forEach(o=>{const li=Math.min(3,o.row);item(uls[li],o.n.short,o.n.title,o.n.id);});
    }
    /* Lenguaje visual: va DENTRO del escenario, junto al diagrama — al final de la página se perdía */
    legendStEl.textContent='';
    const lv=document.createElement('ul');legendStEl.append(lv);
    item(lv,'','Jerarquía: Dirección → coordinación',null,'<i class="line-l1"></i>');
    item(lv,'','Jerarquía: coordinación → mención',null,'<i class="line-l2"></i>');
    item(lv,'','Jerarquía: mención → núcleo',null,'<i class="line-l3"></i>');
    item(lv,'','Órbita: colaboración entre dos áreas',null,'<i class="sym-orb"></i>');
    item(lv,'',`Docente (${dots.length} en total)`,null,'<i class="sym-dot"></i>');
  }

  /* ---------- Transformación con el scroll: t = 0 equipo · t = 1 organigrama ---------- */
  const scrollT=()=>{const r=morphEl.getBoundingClientRect(),tot=r.height-innerHeight;return tot>0?clamp(-r.top/tot):0;};
  const DIRN=byId['dir'],STAFFN=nodes.filter(o=>o.kind==='staff');
  let cur=scrollT(),stepNow=-1,liveNow=null;
  /* Reloj propio de la flotación: al posarse sobre un módulo baja a un cuarto de velocidad
     (se frena suave, no de golpe) para poder leerlo sin que se mueva bajo el cursor. */
  let clk=0,lastNow=0,spd=1,spdTg=1;
  const slowTo=v=>{spdTg=v;};
  const draw=(e,p)=>{e.style.strokeDasharray=p>=.999?'none':'1 1';e.style.strokeDashoffset=(1-p).toFixed(4);e.style.opacity=p>0?'1':'0';};
  function frame(now,force){
    const tg=scrollT();
    cur=(REDUCED||force)?tg:cur+(tg-cur)*.16;if(Math.abs(tg-cur)<.0005)cur=tg;
    const t=cur;
    const mv=MOVE?ease(clamp((t-.03)/.13)):0;                    // solo en celular: el equipo deja paso a la grilla del organigrama
    const ls=MOVE?mv:ease(clamp((t-A0-.1)/.3));
    hint.style.opacity=t<.03?'1':'0';
    /* 3 momentos con holds claros: 01 equipo · 02 organigrama ortogonal (se queda quieto para leerlo) · 03 ecosistema.
       El paso 02→03 es escalonado: primero se van las líneas, después los círculos migran a su posición orbital, al final se dibujan las órbitas. */
    const T3S=.80,step=t<A0+.36?0:(t<T3S?1:2);if(step!==stepNow){stepNow=step;stepK.textContent=STEPS[step][0];stepT.textContent=STEPS[step][1];}
    const p3  =ease(clamp((t-T3S)/.14));          /* progreso global del tercer momento */
    const pOut=ease(clamp((t-T3S)/.045));         /* 1) se retiran líneas, cruces y puntos */
    const pMov=ease(clamp((t-T3S-.035)/.075));    /* 2) los círculos migran al layout de órbitas */
    const pOrb=ease(clamp((t-T3S-.095)/.055));    /* 3) aparecen las órbitas */
    const nw=now||0,dt=lastNow?Math.min(.1,(nw-lastNow)/1000):0;lastNow=nw;
    spd+=(spdTg-spd)*.09;clk+=dt*spd;
    const TS_=clk;                              /* reloj para la flotación orbital (con freno al hover) */
    /* los nombres de nivel entran con el organigrama (fase 2) y se desvanecen al pasar al orbital (fase 3) */
    lvlsEl.style.opacity=(ease(clamp((t-A0-.1)/.3))*(1-p3)).toFixed(3);
    /* la leyenda entra con el organigrama y se queda: explica líneas en la fase 02 y órbitas en la 03 */
    legendStEl.style.opacity=ease(clamp((t-A0-.1)/.3)).toFixed(3);
    lv.forEach(L=>{L.el.style.transform=`translate(${lerp(L.a.x,L.b.x,ls).toFixed(1)}px,${lerp(L.a.y,L.b.y,ls).toFixed(1)}px)${PORT?'':' translateY(-50%)'}`;});

    nodes.forEach(o=>{
      let pA,pB,sc=1;
      if(o.card){pA=ease(clamp((t-A0-o.delay)/.22));pB=ease(clamp((t-A0-.24-o.delay)/.18));}   // 1) se dibuja el círculo · 2) la foto da paso a la sigla (ambas más lentas)
      else{pA=1;pB=sc=ease(clamp((t-o.t0)/.07));}
      o.pB=pB;
      /* Instancia 03: el círculo MIGRA a su posición orbital y queda FLOTANDO: vaivén lento sobre el anillo
         (ángulo) más una respiración radial, cada módulo con su propia fase y periodo. */
      let tx=o.eX,ty=o.eY;
      if(!REDUCED&&o.eRad>0){
        const rg=RING[o.ring];
        const an=o.eAng+(ARCPX/o.eRad)*Math.sin(TS_*rg.w+rg.ph),   /* deriva del anillo completo */
              rd=o.eRad+o.ampR*Math.sin(TS_*o.wR+o.phR);           /* bamboleo propio hacia/desde el centro */
        tx=EC.x+rd*Math.sin(an);ty=EC.y-rd*Math.cos(an);
      }else if(!REDUCED){   /* el centro no orbita: solo cabecea */
        tx=o.eX+Math.sin(TS_*.34+1.1)*3;ty=o.eY+Math.cos(TS_*.27)*3;
      }
      o.cx=lerp(o.oX,tx,pMov);o.cy=lerp(o.oY,ty,pMov);
      o.rNow=o.r*lerp(1,ES*EK,pMov);
      const gs=(o.card?1:sc)*lerp(1,ES*EK,pMov);
      draw(o.circ,o.card?pA:1);o.circ.style.fillOpacity=(pB).toFixed(3);
      o.g.setAttribute('transform',`translate(${o.cx.toFixed(1)} ${o.cy.toFixed(1)}) scale(${Math.max(gs,.001).toFixed(3)})`);
      if(!o.card)o.g.style.opacity=pB.toFixed(3);
      o.txt.style.opacity=clamp((pB-.55)/.45).toFixed(3);
      if(o.cap)o.cap.style.opacity=(clamp((pB-.5)*2)*(1-pOut)).toFixed(3);
      o.crz.style.opacity=(.55*pB*(1-pOut)).toFixed(3);
    });
    CARDS.forEach(c=>{
      /* escritorio: el recuadro no se mueve, se desvanece bajo su círculo · celular: el equipo se desvanece y el organigrama se dibuja en su propia grilla */
      const a=c.a,bw=a.bw,pB=c.node.pB,op=(1-pB)*(1-mv);
      c.card.style.transform=`translate(${a.x.toFixed(1)}px,${a.y.toFixed(1)}px)`;
      c.frame.style.width=bw.toFixed(1)+'px';c.frame.style.height=(1.5*bw).toFixed(1)+'px';c.ph.style.fontSize=(bw*.2).toFixed(1)+'px';
      c.frame.style.opacity=op.toFixed(3);
      c.name.style.opacity=((1-clamp(pB*2))*(1-mv)).toFixed(3);
      c.card.style.visibility=op<.001?'hidden':'';
      c.card.style.pointerEvents=t<Math.min(A0,.05)?'auto':'none';
    });
    /* 1) las líneas ortogonales se retiran antes de que los círculos se muevan (sus trazos están atados a la grilla) */
    edges.forEach(e=>{draw(e.path,ease(clamp((t-e.t0)/e.dur)));e.path.style.opacity=((e.path.style.opacity||1)*(1-pOut)).toFixed(3);});
    /* Dirección unida por radios rectos con su equipo (CF, LG, PR, SO): se recalculan cada cuadro
       porque los círculos flotan, y se mantienen también en el ecosistema. */
    if(DIRN&&STAFFN.length){
      bead.setAttribute('d',STAFFN.map(sn=>{
        const dx=sn.cx-DIRN.cx,dy=sn.cy-DIRN.cy,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
        return 'M'+(DIRN.cx+ux*DIRN.rNow).toFixed(1)+' '+(DIRN.cy+uy*DIRN.rNow).toFixed(1)
             +'L'+(sn.cx-ux*sn.rNow).toFixed(1)+' '+(sn.cy-uy*sn.rNow).toFixed(1);}).join(''));
    }
    draw(bead,ease(clamp((t-A0-.34)/.12)));
    /* 2) los docentes NO se van: migran de la matriz ortogonal a orbitar su propia área, como en la constelación original */
    dots.forEach(d=>{
      d.c.style.opacity=ease(clamp((t-d.t0)/.07)).toFixed(3);
      if(pMov>0&&d.par&&d.hRad){
        const a=d.hAng+(REDUCED?0:TS_*d.spin);
        d.c.setAttribute('cx',lerp(d.oX,d.par.cx+d.hRad*Math.sin(a),pMov).toFixed(1));
        d.c.setAttribute('cy',lerp(d.oY,d.par.cy-d.hRad*Math.cos(a),pMov).toFixed(1));
      }
    });
    items.forEach(it=>{const p=ease(clamp((t-it.t0)/.08))*(1-pOut);it.g.style.opacity=p.toFixed(3);
      it.g.setAttribute('transform',`translate(${it.px.toFixed(1)} ${it.py.toFixed(1)}) scale(${Math.max(p,.001).toFixed(3)})`);});
    /* 3) con los círculos ya en su sitio orbital, se recalculan y dibujan las órbitas de cruce */
    if(pMov>0){rels.forEach(r=>{const a=r.a,b=r.b;
      r.path.setAttribute('cx',((a.cx+b.cx)/2).toFixed(1));r.path.setAttribute('cy',((a.cy+b.cy)/2).toFixed(1));
      r.path.setAttribute('r',(Math.hypot(b.cx-a.cx,b.cy-a.cy)/2).toFixed(1));});}
    rels.forEach(r=>{r.path.style.opacity=pOrb.toFixed(3);});
    /* los anillos de nivel aparecen con la migración: cada estrato queda flotando sobre su propia órbita */
    lvlRings.forEach(c=>{c.style.opacity=pMov.toFixed(3);});
    /* las columnas de cursos entran con el ecosistema y solo entonces son interactivas */
    rails.forEach(c=>{c.style.opacity=pOrb.toFixed(3);c.style.pointerEvents=pOrb>.9?'auto':'none';});
    const live=t>A0+.8;
    if(live!==liveNow){liveNow=live;svg.classList.toggle('live',live);
      svg.querySelectorAll('.node,.it').forEach(g=>g.setAttribute('tabindex',live?0:-1));
      CARDS.forEach(c=>{c.frame.tabIndex=live?-1:0;});}
  }

  /* cualquier módulo, punto de docente o nombre de la lista bajo el cursor frena la flotación */
  {const SEL='.node,.doc,.rail i';
   const dentro=n=>!!(n&&n.closest&&n.closest(SEL));
   stage.addEventListener('mouseover',e=>{if(dentro(e.target))slowTo(.25);});
   stage.addEventListener('mouseout',e=>{if(dentro(e.target)&&!dentro(e.relatedTarget))slowTo(1);});
   stage.addEventListener('focusin',e=>{if(dentro(e.target))slowTo(.25);});
   stage.addEventListener('focusout',e=>{if(!dentro(e.relatedTarget))slowTo(1);});}

  let running=false;
  function loop(now){if(!running)return;frame(now);requestAnimationFrame(loop);}
  buildLegend();
  place();
  new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){if(!running){running=true;requestAnimationFrame(loop);}}else running=false;
  }),{threshold:0}).observe(morphEl);
  let rt=0;
  addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(place,150);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
})();

</script>
<script>
/* =====================================================================
   MODO COORDENADAS · herramienta de autor (no afecta la vista normal)
   Tecla C para activar. El cuadrante de + del fondo pasa a ser una grilla
   direccionable: columnas A, B, C… y filas 1, 2, 3…, con el origen en la
   primera cruz. Al hacer clic se registra la celda y qué elemento hay bajo
   el cursor, para poder dictar "DIR va en F9".
   ===================================================================== */
(function(){
  "use strict";
  const STEP=48, OFF=24;                 /* mismo paso y origen que el fondo de cruces */
  const stage=document.getElementById('stage');
  if(!stage) return;

  const grid=document.createElement('div');grid.className='cgrid';
  const vx=document.createElement('div');vx.className='xh';
  const hy=document.createElement('div');hy.className='xh';
  const mk=document.createElement('div');mk.className='mk';
  grid.append(vx,hy,mk);stage.append(grid);

  const panel=document.createElement('div');panel.className='cpanel';
  panel.innerHTML='<h6>Coordenadas</h6><div class="now">—</div><ol></ol>'
    +'<div class="btns"><button data-a="copy">Copiar</button>'
    +'<button data-a="undo">Borrar última</button>'
    +'<button data-a="clear">Vaciar</button></div>'
    +'<div class="hint2">C para salir · clic para marcar</div>';
  document.body.append(panel);
  const now=panel.querySelector('.now'), list=panel.querySelector('ol');

  const colName=i=>{let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=(i-r-1)/26;}return s;};
  let labels=[], marks=[];

  function build(){
    labels.forEach(e=>e.remove());labels=[];
    const w=stage.clientWidth,h=stage.clientHeight;
    for(let i=0;OFF+i*STEP<w;i++)for(let j=0;OFF+j*STEP<h;j++){
      const e=document.createElement('i');
      e.textContent=colName(i)+(j+1);
      e.style.left=(OFF+i*STEP)+'px';e.style.top=(OFF+j*STEP)+'px';
      e.dataset.c=colName(i)+(j+1);
      grid.append(e);labels.push(e);
    }
  }
  const cellAt=(x,y)=>{
    const i=Math.max(0,Math.round((x-OFF)/STEP)), j=Math.max(0,Math.round((y-OFF)/STEP));
    return {i,j,x:OFF+i*STEP,y:OFF+j*STEP,name:colName(i)+(j+1)};
  };
  /* qué hay bajo el cursor, para que la anotación diga de qué elemento habla */
  function what(ev){
    /* la grilla está encima y se devolvería a sí misma: se aparta un instante del hit-testing */
    const prev=grid.style.pointerEvents;grid.style.pointerEvents='none';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    grid.style.pointerEvents=prev;
    if(!el) return '';
    const n=el.closest('.node,.doc,.rail i,.lvl,.step,.legend2 .lg,.card');
    if(!n) return '';
    if(n.classList.contains('rail')||n.matches('.rail i')) return 'lista: '+n.textContent.trim().slice(0,28);
    const al=n.getAttribute('aria-label');
    if(al) return al.slice(0,34);
    return (n.textContent||'').trim().slice(0,28);
  }

  let on=false, hot=null;
  function paint(ev){
    const r=stage.getBoundingClientRect();
    const x=ev.clientX-r.left, y=ev.clientY-r.top;
    const c=cellAt(x,y);
    vx.style.cssText='left:'+c.x+'px;top:0;width:1px;height:100%';
    hy.style.cssText='left:0;top:'+c.y+'px;width:100%;height:1px';
    mk.style.cssText='left:'+c.x+'px;top:'+c.y+'px';
    if(hot)hot.classList.remove('hot');
    hot=labels.find(e=>e.dataset.c===c.name);
    if(hot)hot.classList.add('hot');
    now.textContent=c.name+'   ('+Math.round(x)+', '+Math.round(y)+')';
  }
  function click(ev){
    const r=stage.getBoundingClientRect();
    const c=cellAt(ev.clientX-r.left, ev.clientY-r.top);
    const q=what(ev);
    marks.push({n:c.name,x:c.x,y:c.y,q});
    const li=document.createElement('li');
    li.innerHTML='<b>'+c.name+'</b><span>'+(q||'—')+'</span>';
    list.append(li);list.scrollTop=list.scrollHeight;
  }
  const texto=()=>marks.map((m,k)=>(k+1)+'. '+m.n+'  ('+m.x+', '+m.y+')'+(m.q?'  — '+m.q:'')).join('\n');

  panel.addEventListener('click',e=>{
    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='copy'){
      const t=texto();
      if(navigator.clipboard&&t) navigator.clipboard.writeText(t).then(()=>{
        e.target.textContent='Copiado';setTimeout(()=>e.target.textContent='Copiar',1100);});
    }
    if(a==='undo'){marks.pop();if(list.lastChild)list.lastChild.remove();}
    if(a==='clear'){marks=[];list.textContent='';}
  });

  function toggle(v){
    on=v;document.body.classList.toggle('coord',on);
    if(on){build();grid.addEventListener('mousemove',paint);grid.addEventListener('click',click);}
    else{grid.removeEventListener('mousemove',paint);grid.removeEventListener('click',click);}
  }
  addEventListener('keydown',e=>{
    if(e.key!=='c'&&e.key!=='C')return;
    if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName||''))) return;
    toggle(!on);
  });
  addEventListener('resize',()=>{if(on)build();});

  /* tres formas de entrar, para no depender de que la página tenga el foco:
     el botón de la esquina, la tecla C, o ?coord=1 en la URL */
  const btn=document.createElement('button');
  btn.className='cbtn';btn.textContent='+ Coordenadas';
  btn.addEventListener('click',()=>toggle(true));
  document.body.append(btn);
  if(/[?&]coord=1/.test(location.search)) toggle(true);
})();
</script>
</body>
